    <ellipse cx="118" cy="285" rx="22" ry="10" transform="rotate(25,118,285)"/>
    <ellipse cx="202" cy="325" rx="26" ry="11" transform="rotate(-20,202,325)"/>
    <ellipse cx="235" cy="288" rx="22" ry="9" transform="rotate(30,235,288)"/>
    <ellipse cx="325" cy="330" rx="24" ry="10" transform="rotate(-25,325,330)"/>
