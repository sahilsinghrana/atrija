<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Fiery gradient background -->
    <radialGradient id="sky" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff4081" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#1a0808" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d0202" stop-opacity="1"/>
    </radialGradient>
    <!-- Ember glow -->
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ff6b35" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4081" stop-opacity="0"/>
    </radialGradient>
    <!-- Flame filter for impressionist brushstroke effect -->
    <filter id="painted" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="8"/>
    </filter>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Distant impressionist stars -->
  <g filter="url(#glow)" opacity="0.6">
    <circle cx="120" cy="80" r="2" fill="#ffd54f"/>
    <circle cx="250" cy="45" r="1.5" fill="#fff0e8"/>
    <circle cx="380" cy="90" r="1.8" fill="#ffd54f"/>
    <circle cx="500" cy="55" r="2.2" fill="#fff0e8"/>
    <circle cx="620" cy="75" r="1.5" fill="#ffd54f"/>
    <circle cx="720" cy="40" r="2" fill="#fff0e8"/>
    <circle cx="60" cy="120" r="1.3" fill="#ffd54f"/>
    <circle cx="180" cy="110" r="1.7" fill="#fff0e8"/>
    <circle cx="340" cy="30" r="1.5" fill="#ffd54f"/>
    <circle cx="560" cy="100" r="1.8" fill="#fff0e8"/>
  </g>

  <!-- Impressionist brushstroke streaks in sky -->
  <g opacity="0.25" filter="url(#painted)">
    <path d="M0,150 Q200,100 400,160 T800,130" stroke="#ff6b35" stroke-width="30" fill="none"/>
    <path d="M0,200 Q150,170 350,210 T800,180" stroke="#ff4081" stroke-width="25" fill="none"/>
    <path d="M0,100 Q300,60 600,120 T800,90" stroke="#ffd54f" stroke-width="20" fill="none"/>
    <path d="M100,50 Q400,20 700,70" stroke="#ff6b35" stroke-width="15" fill="none" opacity="0.4"/>
  </g>

  <!-- Rising embers / fireflies -->
  <g filter="url(#glow)">
    <circle cx="150" cy="350" r="3" fill="#ffd54f" opacity="0.8">
      <animate attributeName="cy" values="350;300;250" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="400" r="2.5" fill="#ff6b35" opacity="0.7">
      <animate attributeName="cy" values="400;340;280" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="370" r="3.5" fill="#ffd54f" opacity="0.9">
      <animate attributeName="cy" values="370;310;250" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="390" r="2" fill="#ff4081" opacity="0.6">
      <animate attributeName="cy" values="390;330;270" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="360" r="2.8" fill="#ffd54f" opacity="0.75">
      <animate attributeName="cy" values="360;300;240" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0.3;0" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="380" r="2" fill="#ff6b35" opacity="0.5">
      <animate attributeName="cy" values="380;320;260" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="420" r="1.8" fill="#ffd54f" opacity="0.65">
      <animate attributeName="cy" values="420;360;300" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;0.25;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Large central sun/celestial body -->
  <g transform="translate(400,250)">
    <circle cx="0" cy="0" r="120" fill="url(#emberGlow)" opacity="0.4"/>
    <circle cx="0" cy="0" r="80" fill="url(#emberGlow)" opacity="0.6"/>
    <circle cx="0" cy="0" r="45" fill="#ffd54f" opacity="0.9"/>
    <circle cx="0" cy="0" r="35" fill="#fff0e8" opacity="0.8"/>
    <!-- Impressionist dabs around the sun -->
    <g opacity="0.3" filter="url(#painted)">
      <circle cx="-70" cy="-30" r="15" fill="#ff6b35"/>
      <circle cx="60" cy="-50" r="12" fill="#ff4081"/>
      <circle cx="50" cy="40" r="18" fill="#ffd54f"/>
      <circle cx="-40" cy="60" r="14" fill="#ff6b35"/>
      <circle cx="0" cy="-75" r="10" fill="#ffd54f"/>
      <circle cx="-90" cy="10" r="11" fill="#ff4081"/>
      <circle cx="85" cy="5" r="13" fill="#ff6b35"/>
    </g>
  </g>

  <!-- Impressionist horizon line with heat shimmer -->
  <g filter="url(#painted)" opacity="0.5">
    <path d="M0,420 Q100,410 200,425 T400,418 T600,430 T800,415" stroke="#ff6b35" stroke-width="4" fill="none"/>
    <path d="M0,440 Q200,430 400,445 T800,435" stroke="#ff4081" stroke-width="3" fill="none"/>
    <path d="M0,460 Q300,450 600,465 T800,455" stroke="#ffd54f" stroke-width="2" fill="none"/>
  </g>

  <!-- Silhouette hills at bottom -->
  <path d="M0,480 Q100,450 200,470 Q350,500 500,460 Q650,440 800,470 L800,600 L0,600 Z" fill="#1a0808" opacity="0.85"/>
  <path d="M0,510 Q150,490 300,505 Q450,520 600,495 Q700,485 800,500 L800,600 L0,600 Z" fill="#0d0202" opacity="0.9"/>

  <!-- Impressionist flower silhouettes (sunflower-like) in the darkness -->
  <g opacity="0.4">
    <g transform="translate(100,520)">
      <line x1="0" y1="0" x2="0" y2="-25" stroke="#ff6b35" stroke-width="2"/>
      <circle cx="0" cy="-28" r="6" fill="#ffd54f" opacity="0.5"/>
    </g>
    <g transform="translate(180,515)">
      <line x1="0" y1="0" x2="0" y2="-20" stroke="#ff6b35" stroke-width="1.5"/>
      <circle cx="0" cy="-23" r="5" fill="#ffd54f" opacity="0.4"/>
    </g>
    <g transform="translate(650,525)">
      <line x1="0" y1="0" x2="0" y2="-22" stroke="#ff6b35" stroke-width="2"/>
      <circle cx="0" cy="-25" r="5.5" fill="#ffd54f" opacity="0.45"/>
    </g>
    <g transform="translate(720,518)">
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#ff6b35" stroke-width="1.5"/>
      <circle cx="0" cy="-21" r="4" fill="#ffd54f" opacity="0.35"/>
    </g>
    <g transform="translate(500,530)">
      <line x1="0" y1="0" x2="0" y2="-15" stroke="#ff6b35" stroke-width="1.5"/>
      <circle cx="0" cy="-18" r="4" fill="#ffd54f" opacity="0.3"/>
    </g>
  </g>

  <!-- Subtle texture overlay -->
  <rect width="800" height="600" fill="url(#sky)" opacity="0.05"/>

  <!-- Title text -->
  <text x="400" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#ffd54f" opacity="0.6" letter-spacing="3">EMBER DAWN</text>
  <text x="400" y="588" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#ff6b35" opacity="0.4" letter-spacing="2">ATRIJĀ · II྽Ⅵ · MDCCCCXXVI</text>
</svg>
