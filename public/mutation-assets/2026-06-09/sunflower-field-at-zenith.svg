<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <filter id="brush" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="42"/>
      <feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="25%" stop-color="#2d6a9f"/>
      <stop offset="50%" stop-color="#f0c040"/>
      <stop offset="75%" stop-color="#f5d060"/>
      <stop offset="100%" stop-color="#fde8a0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="25%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Sky background — bright warm gradient -->
  <rect width="800" height="400" fill="url(#skyGrad)"/>

  <!-- Sky texture dabs -->
  <g opacity="0.2" filter="url(#brush)">
    <rect x="0" y="0" width="800" height="260" fill="#fde68a"/>
  </g>

  <!-- Sun glow — large and bright -->
  <circle cx="400" cy="160" r="140" fill="url(#sunGlow)"/>
  <circle cx="400" cy="160" r="55" fill="#fffbeb" opacity="0.95"/>
  <circle cx="400" cy="160" r="45" fill="#fef3c7"/>
  <circle cx="400" cy="160" r="30" fill="#fde68a"/>

  <!-- Sun rays -->
  <g opacity="0.35" stroke="#fbbf24" stroke-width="4" fill="none">
    <line x1="400" y1="160" x2="340" y2="40"/>
    <line x1="400" y1="160" x2="460" y2="35"/>
    <line x1="400" y1="160" x2="550" y2="70"/>
    <line x1="400" y1="160" x2="250" y2="75"/>
    <line x1="400" y1="160" x2="620" y2="130"/>
    <line x1="400" y1="160" x2="180" y2="140"/>
    <line x1="400" y1="160" x2="640" y2="190"/>
    <line x1="400" y1="160" x2="160" y2="200"/>
  </g>

  <!-- Distant treeline -->
  <path d="M0,250 Q60,220 120,240 Q180,210 240,235 Q300,205 360,230 Q420,200 480,225 Q540,205 600,235 Q660,210 720,230 Q780,215 800,240 L800,280 L0,280 Z" fill="#15803d" opacity="0.7"/>

  <!-- Field ground -->
  <rect x="0" y="280" width="800" height="120" fill="url(#fieldGrad)"/>

  <!-- Field texture -->
  <g opacity="0.25" filter="url(#brush)">
    <rect x="0" y="280" width="800" height="120" fill="#b45309"/>
  </g>

  <!-- Stems -->
  <g stroke="#15803d" stroke-width="3.5" fill="none" opacity="0.9">
    <path d="M100,390 Q95,330 105,290 Q110,265 108,245"/>
    <path d="M220,390 Q225,340 215,295 Q210,270 218,240"/>
    <path d="M340,390 Q335,345 345,300 Q350,275 342,235"/>
    <path d="M470,390 Q475,340 465,295 Q460,270 468,240"/>
    <path d="M590,390 Q585,350 595,305 Q600,280 592,250"/>
    <path d="M710,390 Q705,335 715,290 Q720,265 712,240"/>
