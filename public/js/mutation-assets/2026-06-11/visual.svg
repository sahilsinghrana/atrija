    <ellipse cx="525" cy="242" rx="10" ry="23" fill="#fde68a" transform="rotate(225 525 280)"/>
    <ellipse cx="525" cy="242" rx="10" ry="23" fill="#fbbf24" transform="rotate(270 525 280)"/>
    <ellipse cx="525" cy="242" rx="10" ry="23" fill="#fde68a" transform="rotate(315 525 280)"/>
    <ellipse cx="495" cy="370" rx="26" ry="12" fill="#22c55e" transform="rotate(-28 495 370)"/>
    <ellipse cx="555" cy="350" rx="23" ry="10" fill="#16a34a" transform="rotate(22 555 350)"/>

    <!-- Sunflower 5 -->
    <rect x="660" y="300" width="8" height="170" rx="3" fill="#15803d"/>
    <ellipse cx="664" cy="290" rx="34" ry="34" fill="#f97316"/>
    <ellipse cx="664" cy="290" rx="24" ry="24" fill="#f5c800"/>
    <ellipse cx="664" cy="290" rx="14" ry="14" fill="#92400e"/>
    <ellipse cx="664" cy="254" rx="10" ry="21" fill="#fde68a" transform="rotate(0 664 290)"/>
    <ellipse cx="664" cy="254" rx="10" ry="21" fill="#fbbf24" transform="rotate(60 664 290)"/>
    <ellipse cx="664" cy="254" rx="10" ry="21" fill="#fde68a" transform="rotate(120 664 290)"/>
    <ellipse cx="664" cy="254" rx="10" ry="21" fill="#fbbf24" transform="rotate(180 664 290)"/>
    <ellipse cx="664" cy="254" rx="10" ry="21" fill="#fde68a" transform="rotate(240 664 290)"/>
    <ellipse cx="664" cy="254" rx="10" ry="21" fill="#fbbf24" transform="rotate(300 664 290)"/>
    <ellipse cx="640" cy="375" rx="24" ry="11" fill="#22c55e" transform="rotate(-22 640 375)"/>

    <!-- Sunflower 6 -->
    <rect x="790" y="285" width="9" height="195" rx="3" fill="#15803d"/>
    <ellipse cx="795" cy="275" rx="37" ry="37" fill="#f5c800"/>
    <ellipse cx="795" cy="275" rx="27" ry="27" fill="#fde68a"/>
    <ellipse cx="795" cy="275" rx="16" ry="16" fill="#78350f"/>
    <ellipse cx="795" cy="237" rx="11" ry="23" fill="#fbbf24" transform="rotate(0 795 275)"/>
    <ellipse cx="795" cy="237" rx="11" ry="23" fill="#fde68a" transform="rotate(45 795 275)"/>
    <ellipse cx="795" cy="237" rx="11" ry="23" fill="#fbbf24" transform="rotate(90 795 275)"/>
    <ellipse cx="795" cy="237" rx="11" ry="23" fill="#fde68a" transform="rotate(135 795 275)"/>
    <ellipse cx="795" cy="237" rx="11" ry="23" fill="#fbbf24" transform="rotate(180 795 275)"/>
    <ellipse cx="795" cy="237" rx="11" ry="23" fill="#fde68a" transform="rotate(225 795 275)"/>
    <ellipse cx="795" cy="237" rx="11" ry="23" fill="#fbbf24" transform="rotate(270 795 275)"/>
    <ellipse cx="795" cy="237" rx="11" ry="23" fill="#fde68a" transform="rotate(315 795 275)"/>
    <ellipse cx="765" cy="365" rx="27" ry="12" fill="#22c55e" transform="rotate(-26 765 365)"/>
    <ellipse cx="825" cy="345" rx="24" ry="10" fill="#16a34a" transform="rotate(28 825 345)"/>

    <!-- Sunflower 7 -->
    <rect x="920" y="305" width="7" height="165" rx="3" fill="#15803d"/>
    <ellipse cx="924" cy="295" rx="33" ry="33" fill="#f5c800"/>
    <ellipse cx="924" cy="295" rx="23" ry="23" fill="#fbbf24"/>
    <ellipse cx="924" cy="295" rx="13" ry="13" fill="#92400e"/>
    <ellipse cx="924" cy="260" rx="9" ry="20" fill="#fde68a" transform="rotate(0 924 295)"/>
    <ellipse cx="924" cy="260" rx="9" ry="20" fill="#f5c800" transform="rotate(72 924 295)"/>
    <ellipse cx="924" cy="260" rx="9" ry="20" fill="#fde68a" transform="rotate(144 924 295)"/>
    <ellipse cx="924" cy="260" rx="9" ry="20" fill="#f5c800" transform="rotate(216 924 295)"/>
    <ellipse cx="924" cy="260" rx="9" ry="20" fill="#fde68a" transform="rotate(288 924 295)"/>
    <ellipse cx="900" cy="380" rx="22" ry="10" fill="#22c55e" transform="rotate(-18 900 380)"/>

    <!-- Sunflower 8 -->
    <rect x="1050" y="295" width="8" height="180" rx="3" fill="#15803d"/>
    <ellipse cx="1054" cy="285" rx="35" ry="35" fill="#f97316"/>
    <ellipse cx="1054" cy="285" rx="25" ry="25" fill="#f5c800"/>
    <ellipse cx="1054" cy="285" rx="15" ry="15" fill="#78350f"/>
    <ellipse cx="1054" cy="248" rx="10" ry="22" fill="#fde68a" transform="rotate(0 1054 285)"/>
    <ellipse cx="1054" cy="248" rx="10" ry="22" fill="#fbbf24" transform="rotate(60 1054 285)"/>
    <ellipse cx="1054" cy="248" rx="10" ry="22" fill="#fde68a" transform="rotate(120 1054 285)"/>
    <ellipse cx="1054" cy="248" rx="10" ry="22" fill="#fbbf24" transform="rotate(180 1054 285)"/>
    <ellipse cx="1054" cy="248" rx="10" ry="22" fill="#fde68a" transform="rotate(240 1054 285)"/>
    <ellipse cx="1054" cy="248" rx="10" ry="22" fill="#fbbf24" transform="rotate(300 1054 285)"/>
    <ellipse cx="1030" cy="370" rx="25" ry="11" fill="#22c55e" transform="rotate(-24 1030 370)"/>
    <ellipse cx="1080" cy="355" rx="22" ry="10" fill="#16a34a" transform="rotate(20 1080 355)"/>

    <!-- Sunflower 9 - far right -->
    <rect x="1150" y="310" width="7" height="155" rx="3" fill="#15803d"/>
    <ellipse cx="1154" cy="300" rx="30" ry="30" fill="#f5c800"/>
    <ellipse cx="1154" cy="300" rx="20" ry="20" fill="#fbbf24"/>
    <ellipse cx="1154" cy="300" rx="12" ry="12" fill="#92400e"/>
    <ellipse cx="1154" cy="268" rx="8" ry="18" fill="#fde68a" transform="rotate(0 1154 300)"/>
    <ellipse cx="1154" cy="268" rx="8" ry="18" fill="#f5c800" transform="rotate(72 1154 300)"/>
    <ellipse cx="1154" cy="268" rx="8" ry="18" fill="#fde68a" transform="rotate(144 1154 300)"/>
    <ellipse cx="1154" cy="268" rx="8" ry="18" fill="#f5c800" transform="rotate(216 1154 300)"/>
    <ellipse cx="1154" cy="268" rx="8" ry="18" fill="#fde68a" transform="rotate(288 1154 300)"/>
