<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="sun" cx="65%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="30%" stop-color="#ffd54f"/>
      <stop offset="70%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </radialGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0800"/>
      <stop offset="40%" stop-color="#4a2000"/>
      <stop offset="100%" stop-color="#1a1200"/>
    </linearGradient>
    <filter id="paint">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="42"/>
      <feDisplacementMap in="SourceGraphic" scale="12"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="520" cy="200" r="120" fill="url(#sun)" opacity="0.7" filter="url(#glow)"/>
  <circle cx="520" cy="200" r="60" fill="#fff9c4" opacity="0.9"/>

  <!-- Impressionist stroke background texture -->
  <g opacity="0.3" filter="url(#paint)">
    <line x1="50" y1="400" x2="200" y2="380" stroke="#ff6f00" stroke-width="3"/>
    <line x1="150" y1="420" x2="300" y2="390" stroke="#ffd54f" stroke-width="2"/>
    <line x1="500" y1="350" x2="700" y2="330" stroke="#ff8f00" stroke-width="4"/>
    <line x1="600" y1="400" x2="780" y2="370" stroke="#ffab00" stroke-width="3"/>
    <line x1="30" y1="500" x2="250" y2="480" stroke="#689f38" stroke-width="5"/>
    <line x1="400" y1="500" x2="600" y2="470" stroke="#558b2f" stroke-width="4"/>
    <line x1="100" y1="550" x2="350" y2="520" stroke="#33691e" stroke-width="6"/>
    <line x1="550" y1="530" x2="780" y2="500" stroke="#689f38" stroke-width="5"/>
  </g>

  <!-- Sunflower field - stems -->
  <g stroke="#2e7d32" stroke-width="3">
    <line x1="100" y1="600" x2="105" y2="400"/>
    <line x1="180" y1="600" x2="175" y2="380"/>
    <line x1="270" y1="600" x2="265" y2="360"/>
    <line x1="350" y1="600" x2="360" y2="390"/>
    <line x1="440" y1="600" x2="435" y2="370"/>
    <line x1="530" y1="600" x2="540" y2="385"/>
    <line x1="620" y1="600" x2="615" y2="365"/>
    <line x1="710" y1="600" x2="720" y2="375"/>
  </g>

  <!-- Leaves -->
  <g fill="#388e3c" opacity="0.6">
    <ellipse cx="105" cy="480" rx="25" ry="12" transform="rotate(-20 105 480)"/>
    <ellipse cx="175" cy="470" rx="28" ry="14" transform="rotate(15 175 470)"/>
    <ellipse cx="265" cy="460" rx="22" ry="11" transform="rotate(-10 265 460)"/>
    <ellipse cx="360" cy="475" rx="30" ry="13" transform="rotate(25 360 475)"/>
    <ellipse cx="435" cy="465" rx="24" ry="12" transform="rotate(-15 435 465)"/>
    <ellipse cx="540" cy="480" rx="26" ry="13" transform="rotate(20 540 480)"/>
    <ellipse cx="615" cy="455" rx="22" ry="11" transform="rotate(-25 615 455)"/>
    <ellipse cx="720" cy="460" rx="27" ry="12" transform="rotate(10 720 460)"/>
  </g>

  <!-- Sunflower heads -->
  <g filter="url(#glow)">
    <!-- Flower 1 -->
    <circle cx="105" cy="395" r="30" fill="#f5c800"/>
    <circle cx="105" cy="395" r="15" fill="#ff6f00"/>
    <g fill="#ffd54f"><circle cx="85" cy="380" r="6"/><circle cx="90" cy="410" r="6"/><circle cx="120" cy="380" r="6"/><circle cx="125" cy="410" r="6"/><circle cx="80" cy="395" r="5"/><circle cx="130" cy="395" r="5"/><circle cx="95" cy="375" r="5"/><circle cx="115" cy="415" r="5"/></g>
    <circle cx="105" cy="395" r="8" fill="#bf360c" opacity="0.7"/>

    <!-- Flower 2 -->
    <circle cx="175" cr="375" r="28" fill="#f5c800"/>
    <circle cx="175" cy="375" r="14" fill="#ff8f00"/>
    <g fill="#ffca28"><circle cx="156" cy="360" r="5"/><circle cx="160" cy="390" r="5"/><circle cx="189" cy="360" r="5"/><circle cx="195" cy="390" r="5"/><circle cx="150" cy="375" r="5"/><circle cx="200" cy="375" r="5"/><circle cx="165" cy="358" r="4"/><circle cx="185" cy="392" r="4"/></g>
    <circle cx="175" cy="375" r="7" fill="#e65100" opacity="0.6"/>

    <!-- Flower 3 -->
    <circle cx="265" cy="355" r="32" fill="#f5c800"/>
    <circle cx="265" cy="355" r="16" fill="#ff6f00"/>
    <g fill="#ffd54f"><circle cx="243" cy="340" r="6"/><circle cx="248" cy="372" r="6"/><circle cx="282" cy="340" r="6"/><circle cx="287" cy="372" r="6"/><circle cx="240" cy="355" r="5"/><circle cx="290" cy="355" r="5"/><circle cx="255" cy="335" r="5"/><circle cx="275" cy="378" r="5"/></g>
    <circle cx="265" cy="355" r="9" fill="#bf360c" opacity="0.7"/>

    <!-- Flower 4 -->
    <circle cx="360" cy="385" r="27" fill="#f5c800"/>
    <circle cx="360" cy="385" r="13" fill="#ff8f00"/>
    <g fill="#ffca28"><circle cx="342" cy="370" r="5"/><circle cx="347" cy="400" r="5"/><circle cx="373" cy="370" r="5"/><circle cx="378" cy="400" r="5"/><circle cx="337" cy="385" r="5"/><circle cx="383" cy="385" r="5"/><circle cx="352" cy="365" r="4"/><circle cx="368" cy="405" r="4"/></g>
    <circle cx="360" cy="385" r="7" fill="#e65100" opacity="0.6"/>

    <!-- Flower 5 -->
    <circle cx="435" cy="365" r="30" fill="#f5c800"/>
    <circle cx="435" cy="365" r="15" fill="#ff6f00"/>
    <g fill="#ffd54f"><circle cx="415" cy="350" r="6"/><circle cx="420" cy="382" r="6"/><circle cx="452" cy="350" r="6"/><circle cx="457" cy="382" r="6"/><circle cx="412" cy="365" r="5"/><circle cx="458" cy="365" r="5"/><circle cx="428" cy="345" r="5"/><circle cx="445" cy="388" r="5"/></g>
    <circle cx="435" cy="365" r="8" fill="#bf360c" opacity="0.7"/>

    <!-- Flower 6 -->
    <circle cx="540" cy="380" r="29" fill="#f5c800"/>
    <circle cx="540" cy="380" r="14" fill="#ff8f00"/>
    <g fill="#ffca28"><circle cx="521" cy="365" r="5"/><circle cx="526" cy="395" r="5"/><circle cx="556" cy="365" r="5"/><circle cx="561" cy="395" r="5"/><circle cx="516" cy="380" r="5"/><circle cx="564" cy="380" r="5"/><circle cx="530" cy="362" r="5"/><circle cx="550" cy="398" r="5"/></g>
    <circle cx="540" cy="380" r="7" fill="#e65100" opacity="0.6"/>

    <!-- Flower 7 -->
    <circle cx="615" cy="360" r="31" fill="#f5c800"/>
    <circle cx="615" cy="360" r="15" fill="#ff6f00"/>
    <g fill="#ffd54f"><circle cx="594" cy="345" r="6"/><circle cx="599" cy="377" r="6"/><circle cx="632" cy="345" r="6"/><circle cx="637" cy="377" r="6"/><circle cx="591" cy="360" r="5"/><circle cx="639" cy="360" r="5"/><circle cx="607" cy="342" r="5"/><circle cx="623" cy="380" r="5"/></g>
    <circle cx="615" cy="360" r="9" fill="#bf360c" opacity="0.7"/>

    <!-- Flower 8 -->
    <circle cx="720" cy="370" r="28" fill="#f5c800"/>
    <circle cx="720" cy="370" r="14" fill="#ff8f00"/>
    <g fill="#ffca28"><circle cx="701" cy="355" r="5"/><circle cx="706" cy="385" r="5"/><circle cx="737" cy="355" r="5"/><circle cx="742" cy="385" r="5"/><circle cx="696" cy="370" r="5"/><circle cx="744" cy="370" r="5"/><circle cx="714" cy="350" r="5"/><circle cx="730" cy="390" r="5"/></g>
    <circle cx="720" cy="370" r="7" fill="#e65100" opacity="0.6"/>
  </g>

  <!-- Floating pollen/light particles -->
  <g fill="#fff9c4" opacity="0.8">
    <circle cx="480" cy="150" r="2"/>
    <circle cx="560" cy="180" r="1.5"/>
    <circle cx="440" cy="220" r="2.5"/>
    <circle cx="600" cy="140" r="1.8"/>
    <circle cx="350" cy="250" r="1.5"/>
    <circle cx="680" cy="230" r="2"/>
    <circle cx="420" cy="170" r="1.2"/>
    <circle cx="580" cy="250" r="1.8"/>
    <circle cx="300" cy="180" r="2"/>
    <circle cx="650" cy="280" r="1.5"/>
    <circle cx="250" cy="300" r="2.2"/>
    <circle cx="750" cy="190" r="1.8"/>
    <circle cx="150" cy="280" r="1.5"/>
    <circle cx="700" cy="320" r="2"/>
    <circle cx="500" cy="300" r="1.3"/>
  </g>

  <!-- Impressionist stroke highlights -->
  <g stroke-linecap="round" opacity="0.4">
    <line x1="500" y1="180" x2="540" y2="190" stroke="#fff9c4" stroke-width="2"/>
    <line x1="460" y1="230" x2="510" y2="220" stroke="#ffd54f" stroke-width="3"/>
    <line x1="560" y1="150" x2="600" y2="165" stroke="#ffca28" stroke-width="2"/>
    <line x1="380" y1="260" x2="420" y2="250" stroke="#ffab40" stroke-width="2.5"/>
    <line x1="620" y1="200" x2="660" y2="210" stroke="#ffe082" stroke-width="2"/>
  </g>

  <!-- Golden field horizon glow -->
  <rect x="0" y="500" width="800" height="100" fill="#1a1200" opacity="0.5"/>
  <ellipse cx="400" cy="520" rx="450" ry="40" fill="#ff8f00" opacity="0.15"/>
  <ellipse cx="500" cy="510" rx="300" ry="25" fill="#ffd54f" opacity="0.1"/>

  <!-- Vignette -->
  <rect x="0" y="0" width="800" height="600" fill="url(#vignette)" opacity="0.3"/>
</svg>