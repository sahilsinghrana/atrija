    <circle cx="108" cy="238" r="17" fill="#92400e"/>
    <circle cx="108" cy="238" r="10" fill="#78350f"/>
    <g fill="#fbbf24" opacity="0.95">
      <ellipse cx="108" cy="213" rx="8" ry="15" transform="rotate(0,108,238)"/>
      <ellipse cx="129" cy="222" rx="8" ry="15" transform="rotate(40,108,238)"/>
      <ellipse cx="132" cy="242" rx="8" ry="15" transform="rotate(80,108,238)"/>
      <ellipse cx="122" cy="258" rx="8" ry="15" transform="rotate(130,108,238)"/>
      <ellipse cx="96" cy="260" rx="8" ry="15" transform="rotate(190,108,238)"/>
      <ellipse cx="85" cy="248" rx="8" ry="15" transform="rotate(240,108,238)"/>
      <ellipse cx="88" cy="224" rx="8" ry="15" transform="rotate(300,108,238)"/>
