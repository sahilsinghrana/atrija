<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6bb5ff"/>
      <stop offset="40%" stop-color="#4a90d9"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f5c800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="brushTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="600" fill="url(#skyGrad)"/>

  <!-- Sun glow -->
  <ellipse cx="600" cy="280" rx="180" ry="120" fill="url(#sunGlow)" opacity="0.7"/>
  <ellipse cx="600" cy="280" rx="60" ry="60" fill="#fffbeb" opacity="0.9"/>
  <ellipse cx="600" cy="280" rx="40" ry="40" fill="#ffffff"/>

  <!-- Sun rays -->
  <g opacity="0.3" filter="url(#brushTexture)">
    <line x1="600" y1="280" x2="400" y2="100" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <line x1="600" y1="280" x2="800" y2="100" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>
    <line x1="600" y1="280" x2="300" y2="200" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <line x1="600" y1="280" x2="900" y2="200" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <line x1="600" y1="280" x2="350" y2="350" stroke="#f5c800" stroke-width="5" stroke-linecap="round"/>
    <line x1="600" y1="280" x2="850" y2="350" stroke="#f5c800" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Clouds -->
  <g opacity="0.4" filter="url(#brushTexture)">
    <ellipse cx="200" cy="150" rx="80" ry="30" fill="#ffffff"/>
    <ellipse cx="240" cy="140" rx="60" ry="25" fill="#fffbeb"/>
    <ellipse cx="950" cy="120" rx="90" ry="28" fill="#ffffff"/>
    <ellipse cx="980" cy="110" rx="55" ry="22" fill="#fffbeb"/>
    <ellipse cx="1010" cy="130" rx="45" ry="20" fill="#fde68a"/>
  </g>

  <!-- Distant hills -->
  <ellipse cx="300" cy="420" rx="350" ry="80" fill="#14b8a6" opacity="0.4"/>
  <ellipse cx="900" cy="430" rx="400" ry="70" fill="#22c55e" opacity="0.3"/>

  <!-- Ground -->
  <rect x="0" y="420" width="1200" height="180" fill="url(#groundGrad)" opacity="0.8"/>

  <!-- Sunflower field - back row -->
  <g filter="url(#brushTexture)">
    <!-- Sunflower 1 -->
    <rect x="80" y="300" width="8" height="180" rx="3" fill="#15803d"/>
    <ellipse cx="84" cy="290" rx="35" ry="35" fill="#f5c800"/>
    <ellipse cx="84" cy="290" rx="25" ry="25" fill="#fbbf24"/>
    <ellipse cx="84" cy="290" rx="15" ry="15" fill="#92400e"/>
    <!-- petals -->
    <ellipse cx="84" cy="252" rx="10" ry="22" fill="#fde68a" transform="rotate(0 84 290)"/>
    <ellipse cx="84" cy="252" rx="10" ry="22" fill="#f5c800" transform="rotate(45 84 290)"/>
    <ellipse cx="84" cy="252" rx="10" ry="22" fill="#fde68a" transform="rotate(90 84 290)"/>
    <ellipse cx="84" cy="252" rx="10" ry="22" fill="#f5c800" transform="rotate(135 84 290)"/>
    <ellipse cx="84" cy="252" rx="10" ry="22" fill="#fde68a" transform="rotate(180 84 290)"/>
    <ellipse cx="84" cy="252" rx="10" ry="22" fill="#f5c800" transform="rotate(225 84 290)"/>
    <ellipse cx="84" cy="252" rx="10" ry="22" fill="#fde68a" transform="rotate(270 84 290)"/>
    <ellipse cx="84" cy="252" rx="10" ry="22" fill="#f5c800" transform="rotate(315 84 290)"/>
    <!-- leaves -->
    <ellipse cx="60" cy="370" rx="25" ry="12" fill="#22c55e" transform="rotate(-30 60 370)"/>
    <ellipse cx="110" cy="350" rx="22" ry="10" fill="#16a34a" transform="rotate(25 110 350)"/>

    <!-- Sunflower 2 -->
    <rect x="220" y="280" width="9" height="200" rx="3" fill="#15803d"/>
    <ellipse cx="225" cy="270" rx="38" ry="38" fill="#f97316"/>
    <ellipse cx="225" cy="270" rx="28" ry="28" fill="#f5c800"/>
    <ellipse cx="225" cy="270" rx="16" ry="16" fill="#78350f"/>
    <ellipse cx="225" cy="230" rx="11" ry="24" fill="#fde68a" transform="rotate(0 225 270)"/>
    <ellipse cx="225" cy="230" rx="11" ry="24" fill="#fbbf24" transform="rotate(60 225 270)"/>
    <ellipse cx="225" cy="230" rx="11" ry="24" fill="#fde68a" transform="rotate(120 225 270)"/>
    <ellipse cx="225" cy="230" rx="11" ry="24" fill="#fbbf24" transform="rotate(180 225 270)"/>
    <ellipse cx="225" cy="230" rx="11" ry="24" fill="#fde68a" transform="rotate(240 225 270)"/>
    <ellipse cx="225" cy="230" rx="11" ry="24" fill="#fbbf24" transform="rotate(300 225 270)"/>
    <ellipse cx="195" cy="360" rx="28" ry="13" fill="#22c55e" transform="rotate(-25 195 360)"/>
    <ellipse cx="255" cy="340" rx="24" ry="11" fill="#16a34a" transform="rotate(30 255 340)"/>

    <!-- Sunflower 3 -->
    <rect x="380" y="310" width="7" height="160" rx="3" fill="#15803d"/>
    <ellipse cx="384" cy="300" rx="32" ry="32" fill="#f5c800"/>
    <ellipse cx="384" cy="300" rx="22" ry="22" fill="#fbbf24"/>
    <ellipse cx="384" cy="300" rx="13" ry="13" fill="#92400e"/>
    <ellipse cx="384" cy="265" rx="9" ry="20" fill="#fde68a" transform="rotate(0 384 300)"/>
    <ellipse cx="384" cy="265" rx="9" ry="20" fill="#f5c800" transform="rotate(72 384 300)"/>
    <ellipse cx="384" cy="265" rx="9" ry="20" fill="#fde68a" transform="rotate(144 384 300)"/>
    <ellipse cx="384" cy="265" rx="9" ry="20" fill="#f5c800" transform="rotate(216 384 300)"/>
    <ellipse cx="384" cy="265" rx="9" ry="20" fill="#fde68a" transform="rotate(288 384 300)"/>
    <ellipse cx="360" cy="380" rx="22" ry="10" fill="#22c55e" transform="rotate(-20 360 380)"/>

    <!-- Sunflower 4 -->
    <rect x="520" y="290" width="9" height="190" rx="3" fill="#15803d"/>
    <ellipse cx="525" cy="280" rx="36" ry="36" fill="#f5c800"/>
    <ellipse cx="525" cy="280" rx="26" ry="26" fill="#fde68a"/>
    <ellipse cx="525" cy="280" rx="15" ry="15" fill="#78350f"/>
    <ellipse cx="525" cy="242" rx="10" ry="23" fill="#fbbf24" transform="rotate(0 525 280)"/>
    <ellipse cx="525" cy="242" rx="10" ry="23" fill="#fde68a" transform="rotate(45 525 280)"/>
    <ellipse cx="525" cy="242" rx="10" ry="23" fill="#fbbf24" transform="rotate(90 525 280)"/>
