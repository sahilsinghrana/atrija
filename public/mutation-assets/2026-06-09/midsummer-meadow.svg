<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background:#0a0a1a">
  <defs>
    <!-- Starry night palette -->
    <radialGradient id="skyGlow" cx="50%" cy="30%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1a237e" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#0a0a1a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ffd54f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tulipGold" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1a1200" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stemGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0.3" />
    </linearGradient>
    <filter id="brushBlur">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Background: deep starry night -->
  <rect width="800" height="500" fill="#0a0a1a" />
  <rect width="800" height="500" fill="url(#skyGlow)" />

  <!-- Background stars (small, scattered) -->
  <g opacity="0.7">
    <!-- Cluster 1: upper left -->
    <circle cx="80" cy="45" r="1.5" fill="#e8e8f0" opacity="0.9" />
    <circle cx="95" cy="60" r="1.0" fill="#e8e8f0" opacity="0.6" />
    <circle cx="65" cy="70" r="0.8" fill="#4fc3f7" opacity="0.5" />
    <circle cx="110" cy="35" r="1.2" fill="#e8e8f0" opacity="0.7" />
    <circle cx="50" cy="50" r="0.7" fill="#ffd54f" opacity="0.4" />

    <!-- Cluster 2: upper right -->
    <circle cx="720" cy="55" r="1.5" fill="#e8e8f0" opacity="0.8" />
    <circle cx="740" cy="40" r="0.9" fill="#4fc3f7" opacity="0.6" />
    <circle cx="695" cy="70" r="1.0" fill="#e8e8f0" opacity="0.7" />
    <circle cx="760" cy="65" r="0.8" fill="#ffd54f" opacity="0.5" />
    <circle cx="705" cy="30" r="0.7" fill="#e8e8f0" opacity="0.4" />

    <!-- Scattered stars across sky -->
    <circle cx="200" cy="80" r="1.0" fill="#e8e8f0" opacity="0.6" />
    <circle cx="350" cy="30" r="1.3" fill="#4fc3f7" opacity="0.7" />
    <circle cx="450" cy="95" r="0.9" fill="#e8e8f0" opacity="0.5" />
    <circle cx="550" cy="50" r="1.1" fill="#ffd54f" opacity="0.6" />
    <circle cx="620" cy="90" r="0.8" fill="#e8e8f0" opacity="0.4" />
    <circle cx="150" cy="120" r="0.7" fill="#4fc3f7" opacity="0.5" />
    <circle cx="300" cy="110" r="1.0" fill="#e8e8f0" opacity="0.6" />
    <circle cx="500" cy="75" r="0.9" fill="#e8e8f0" opacity="0.7" />

    <!-- Tiny distant stars -->
    <circle cx="40" cy="150" r="0.5" fill="#e8e8f0" opacity="0.3" />
    <circle cx="180" cy="55" r="0.5" fill="#e8e8f0" opacity="0.4" />
    <circle cx="280" cy="45" r="0.6" fill="#4fc3f7" opacity="0.3" />
    <circle cx="390" cy="65" r="0.5" fill="#e8e8f0" opacity="0.3" />
    <circle cx="480" cy="25" r="0.5" fill="#ffd54f" opacity="0.4" />
    <circle cx="650" cy="35" r="0.6" fill="#e8e8f0" opacity="0.4" />
    <circle cx="770" cy="100" r="0.5" fill="#e8e8f0" opacity="0.3" />
  </g>

  <!-- Crescent moon (upper right area) -->
  <g transform="translate(700, 80)">
    <circle r="35" fill="url(#moonGlow)" opacity="0.3" />
    <circle r="22" fill="#ffd54f" opacity="0.85" />
    <circle r="19" fill="#0a0a1a" transform="translate(8, -5)" opacity="0.85" />
    <!-- Moon glow halo -->
    <circle r="40" fill="none" stroke="#ffd54f" stroke-width="0.5" opacity="0.2" />
    <circle r="48" fill="none" stroke="#ffd54f" stroke-width="0.3" opacity="0.1" />
  </g>

  <!-- Distant hills / meadow background -->
  <path d="M0 380 Q200 320 400 350 Q600 380 800 340 L800 500 L0 500 Z" fill="#0d1b0d" opacity="0.8" />
  <path d="M0 400 Q150 370 350 390 Q550 410 800 380 L800 500 L0 500 Z" fill="#0a1a0a" opacity="0.9" />

  <!-- Ambient meadow glow -->
  <ellipse cx="400" cy="450" rx="350" ry="60" fill="url(#tulipGold)" />

  <!-- Tulip group 1 (left side) -->
  <g transform="translate(120, 420) scale(0.8)">
    <!-- Stems -->
    <path d="M0 0 Q-5 -40 -3 -70" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0.9" />
    <path d="M25 0 Q30 -35 28 -65" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0.9" />
    <path d="M50 0 Q48 -45 52 -80" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0.9" />
    <!-- Leaves -->
    <path d="M-3 -35 Q-25 -45 -15 -55 Q-5 -45 -3 -35" fill="#1b5e20" opacity="0.8" />
    <path d="M28 -30 Q45 -38 40 -50 Q32 -42 28 -30" fill="#1b5e20" opacity="0.8" />
    <!-- Tulip heads -->
    <path d="M-8 -70 Q-3 -85 2 -90 Q7 -85 5 -70 Q2 -65 -3 -65 Z" fill="#e65100" opacity="0.9" />
    <path d="M-6 -72 Q-2 -82 1 -86" stroke="#ff8f00" stroke-width="1" fill="none" opacity="0.6" />
    <path d="M23 -65 Q28 -78 33 -83 Q38 -78 36 -65 Q33 -60 28 -60 Z" fill="#f5c800" opacity="0.9" />
    <path d="M25 -67 Q28 -75 32 -80" stroke="#ffd54f" stroke-width="1" fill="none" opacity="0.6" />
    <path d="M47 -80 Q52 -95 57 -100 Q62 -95 60 -80 Q56 -75 52 -75 Z" fill="#c62828" opacity="0.9" />
    <path d="M48 -82 Q52 -92 56 -97" stroke="#ff6f00" stroke-width="0.8" fill="none" opacity="0.5" />
  </g>

  <!-- Tulip group 2 (center-left) -->
  <g transform="translate(280, 410) scale(0.9)">
    <path d="M0 0 Q3 -50 5 -85" stroke="#2e7d32" stroke-width="2.5" fill="none" opacity="0.9" />
    <path d="M30 0 Q25 -45 22 -75" stroke="#2e7d32" stroke-width="2.5" fill="none" opacity="0.9" />
    <path d="M60 0 Q65 -55 68 -90" stroke="#2e7d32" stroke-width="2.5" fill="none" opacity="0.9" />
    <path d="M5 -45 Q-18 -55 -12 -68 Q-5 -58 5 -45" fill="#2e7d32" opacity="0.8" />
    <path d="M22 -40 Q40 -48 35 -62 Q28 -53 22 -40" fill="#2e7d32" opacity="0.8" />
    <!-- Tulip heads -->
    <path d="M-5 -85 Q-1 -100 4 -108 Q9 -100 7 -85 Q4 -78 0 -78 Z" fill="#ff6f00" opacity="0.9" />
    <path d="M-3 -88 Q0 -98 3 -104" stroke="#ffb74d" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M17 -75 Q22 -90 27 -98 Q32 -90 30 -75 Q27 -68 22 -68 Z" fill="#c62828" opacity="0.9" />
    <path d="M27 -90 Q32 -105 37 -113 Q42 -105 40 -90 Q37 -83 32 -83 Z" fill="#5d4037" opacity="0.8" />
    <path d="M29 -93 Q33 -103 36 -109" stroke="#8d6e63" stroke-width="0.8" fill="none" opacity="0.5" />
  </g>

  <!-- Lily center focal point -->
  <g transform="translate(400, 400)">
    <!-- Thick stem -->
    <path d="M0 0 Q-3 -60 -5 -110" stroke="#1b5e20" stroke-width="3" fill="none" opacity="0.9" />
    <!-- Broad leaves -->
    <path d="M-5 -55 Q-30 -70 -25 -90 Q-15 -75 -5 -55" fill="#2e7d32" opacity="0.85" />
    <path d="M-5 -80 Q-25 -95 -20 -110 Q-12 -95 -5 -80" fill="#1b5e20" opacity="0.8" />
    <!-- Lily bloom: open, facing viewer -->
    <g transform="translate(-5, -130) rotate(-5, 5, 20)">
      <!-- Outer petals -->
      <path d="M5 0 Q-15 -15 -10 -35 Q-5 -25 5 -20 Z" fill="#fce4ec" opacity="0.9" />
      <path d="M5 0 Q25 -15 30 -35 Q20 -25 5 -20 Z" fill="#fce4ec" opacity="0.9" />
      <path d="M5 0 Q-20 5 -30 -5 Q-15 -5 5 -5 Z" fill="#ff80ab" opacity="0.85" />
      <path d="M5 0 Q20 5 30 -5 Q15 -5 5 -5 Z" fill="#ff80ab" opacity="0.85" />
      <path d="M5 0 Q-10 15 -25 20 Q-10 10 5 5 Z" fill="#fce4ec" opacity="0.9" />
      <path d="M5 0 Q10 15 25 20 Q10 10 5 5 Z" fill="#fce4ec" opacity="0.9" />
      <!-- Center -->
      <ellipse cx="5" cy="0" rx="6" ry="8" fill="#c62828" opacity="0.7" />
      <!-- Stamens -->
      <line x1="3" y1="5" x2="0" y2="18" stroke="#c62828" stroke-width="1" opacity="0.6" />
      <line x1="7" y1="5" x2="10" y2="18" stroke="#c62828" stroke-width="1" opacity="0.6" />
      <line x1="5" y1="6" x2="5" y2="20" stroke="#c62828" stroke-width="1" opacity="0.6" />
      <circle cx="0" cy="19" r="1.5" fill="#ff6f00" opacity="0.7" />
      <circle cx="10" cy="19" r="1.5" fill="#ff6f00" opacity="0.7" />
      <circle cx="5" cy="21" r="1.5" fill="#ff6f00" opacity="0.7" />
    </g>
  </g>

  <!-- Sunflower (right side, tall) -->
  <g transform="translate(560, 380)">
    <path d="M0 0 Q5 -80 8 -160" stroke="#2e7d32" stroke-width="4" fill="none" opacity="0.9" />
    <path d="M8 -70 Q-25 -85 -20 -105 Q-10 -90 8 -70" fill="#1b5e20" opacity="0.85" />
    <path d="M8 -120 Q30 -135 25 -155 Q15 -140 8 -120" fill="#2e7d32" opacity="0.8" />
    <!-- Sunflower head -->
    <g transform="translate(8, -170)">
      <!-- Petals -->
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#f5c800" opacity="0.9" transform="rotate(0)" />
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#f5c800" opacity="0.9" transform="rotate(30)" />
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#f5c800" opacity="0.9" transform="rotate(60)" />
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#f5c800" opacity="0.9" transform="rotate(90)" />
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#f5c800" opacity="0.9" transform="rotate(120)" />
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#f5c800" opacity="0.9" transform="rotate(150)" />
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#ff8f00" opacity="0.85" transform="rotate(15)" />
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#ff8f00" opacity="0.85" transform="rotate(45)" />
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#ff8f00" opacity="0.85" transform="rotate(75)" />
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#ff8f00" opacity="0.85" transform="rotate(105)" />
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#ff8f00" opacity="0.85" transform="rotate(135)" />
      <ellipse cx="0" cy="-22" rx="8" ry="18" fill="#ff8f00" opacity="0.85" transform="rotate(165)" />
      <!-- Center disk -->
      <circle r="16" fill="#5d4037" opacity="0.9" />
      <circle r="14" fill="#3e2723" opacity="0.8" />
      <!-- Seed spiral pattern -->
      <circle cx="-4" cy="-5" r="1.5" fill="#8d6e63" opacity="0.6" />
      <circle cx="4" cy="-5" r="1.5" fill="#8d6e63" opacity="0.6" />
      <circle cx="0" cy="6" r="1.5" fill="#8d6e63" opacity="0.6" />
      <circle cx="-6" cy="2" r="1.5" fill="#8d6e63" opacity="0.6" />
      <circle cx="6" cy="2" r="1.5" fill="#8d6e63" opacity="0.6" />
      <circle cx="0" cy="0" r="2" fill="#4e342e" opacity="0.7" />
    </g>
  </g>

  <!-- Tulip group 3 (far right) -->
  <g transform="translate(680, 430) scale(0.7)">
    <path d="M0 0 Q-3 -40 -5 -70" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0.9" />
    <path d="M20 0 Q25 -35 28 -65" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0.9" />
    <path d="M-2 -35 Q-20 -42 -16 -55 Q-8 -46 -2 -35" fill="#1b5e20" opacity="0.8" />
    <path d="M-7 -70 Q-2 -85 3 -90 Q8 -85 6 -70 Q3 -65 -2 -65 Z" fill="#e65100" opacity="0.9" />
    <path d="M23 -65 Q28 -78 33 -83 Q38 -78 36 -65 Q33 -60 28 -60 Z" fill="#f5c800" opacity="0.9" />
  </g>

  <!-- Foreground grass strokes (impressionist style) -->
  <g opacity="0.6">
    <path d="M0 480 Q50 470 100 478" stroke="#2e7d32" stroke-width="1.5" fill="none" />
    <path d="M100 485 Q180 472 250 480" stroke="#1b5e20" stroke-width="1.5" fill="none" />
    <path d="M250 478 Q350 468 450 476" stroke="#2e7d32" stroke-width="1.5" fill="none" />
    <path d="M450 482 Q550 470 650 478" stroke="#1b5e20" stroke-width="1.5" fill="none" />
    <path d="M650 476 Q720 468 800 475" stroke="#2e7d32" stroke-width="1.5" fill="none" />
    <!-- Taller grass blades -->
    <path d="M50 480 Q48 460 52 445" stroke="#2e7d32" stroke-width="1" fill="none" opacity="0.5" />
    <path d="M180 482 Q175 458 182 440" stroke="#1b5e20" stroke-width="1" fill="none" opacity="0.5" />
    <path d="M320 478 Q325 455 318 438" stroke="#2e7d32" stroke-width="1" fill="none" opacity="0.5" />
    <path d="M500 480 Q495 455 505 435" stroke="#1b5e20" stroke-width="1" fill="none" opacity="0.5" />
    <path d="M620 478 Q625 458 618 442" stroke="#2e7d32" stroke-width="1" fill="none" opacity="0.5" />
    <path d="M750 476 Q745 455 755 438" stroke="#1b5e20" stroke-width="1" fill="none" opacity="0.5" />
  </g>

  <!-- Fireflies / floating particles (midsummer magic) -->
  <g filter="url(#softGlow)">
    <circle cx="150" cy="350" r="2" fill="#ffd54f" opacity="0.6" />
    <circle cx="300" cy="320" r="1.5" fill="#ffd54f" opacity="0.5" />
    <circle cx="450" cy="340" r="2" fill="#4fc3f7" opacity="0.4" />
    <circle cx="600" cy="330" r="1.5" fill="#ffd54f" opacity="0.5" />
    <circle cx="220" cy="380" r="1.5" fill="#ffd54f" opacity="0.4" />
    <circle cx="520" cy="360" r="2" fill="#4fc3f7" opacity="0.3" />
    <circle cx="380" cy="310" r="1.5" fill="#ffd54f" opacity="0.5" />
    <circle cx="700" cy="350" r="1.5" fill="#ffd54f" opacity="0.4" />
  </g>

  <!-- Subtle brushstroke texture overlay -->
  <rect width="800" height="500" fill="none" stroke="#1a237e" stroke-width="0.5" opacity="0.1" />

  <!-- Title text (subtle, bottom) -->
  <text x="400" y="490" text-anchor="middle" font-family="serif" font-size="11" fill="#e8e8f0" opacity="0.3" font-style="italic">
    midsummer meadow — atrijā
  </text>
</svg>