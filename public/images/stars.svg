<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#nightSky)"/>
  <!-- Stars -->
  <g fill="#fff" opacity="0.9">
    <circle cx="50" cy="30" r="1.5"/><circle cx="120" cy="80" r="2"/><circle cx="200" cy="40" r="1"/>
    <circle cx="280" cy="100" r="1.5"/><circle cx="350" cy="50" r="2"/><circle cx="420" cy="120" r="1"/>
    <circle cx="500" cy="60" r="1.5"/><circle cx="580" cy="90" r="2"/><circle cx="650" cy="40" r="1"/>
    <circle cx="720" cy="110" r="1.5"/><circle cx="80" cy="150" r="1"/><circle cx="160" cy="180" r="1.5"/>
    <circle cx="240" cy="160" r="2"/><circle cx="320" cy="200" r="1"/><circle cx="400" cy="170" r="1.5"/>
    <circle cx="480" cy="190" r="2"/><circle cx="560" cy="150" r="1"/><circle cx="640" cy="180" r="1.5"/>
    <circle cx="720" cy="160" r="2"/><circle cx="100" cy="220" r="1"/><circle cx="180" cy="250" r="1.5"/>
    <circle cx="260" cy="230" r="2"/><circle cx="340" cy="270" r="1"/><circle cx="420" cy="240" r="1.5"/>
    <circle cx="500" cy="260" r="2"/><circle cx="580" cy="220" r="1"/><circle cx="660" cy="250" r="1.5"/>
    <circle cx="740" cy="230" r="2"/>
  </g>
  <!-- Constellation lines -->
  <g stroke="#6688cc" stroke-width="1" fill="none" opacity="0.4">
    <line x1="100" y1="80" x2="200" y2="100"/>
    <line x1="200" y1="100" x2="300" y2="80"/>
    <line x1="300" y1="80" x2="400" y2="120"/>
    <line x1="400" y1="120" x2="500" y2="90"/>
    <line x1="500" y1="90" x2="600" y2="110"/>
    <line x1="600" y1="110" x2="700" y2="80"/>
  </g>
  <!-- Brighter constellation stars -->
  <g fill="#ffd54f">
    <circle cx="100" cy="80" r="3"/><circle cx="200" cy="100" r="3"/>
    <circle cx="300" cy="80" r="3"/><circle cx="400" cy="120" r="3"/>
    <circle cx="500" cy="90" r="3"/><circle cx="600" cy="110" r="3"/>
    <circle cx="700" cy="80" r="3"/>
  </g>
  <!-- Nebula glow -->
  <ellipse cx="400" cy="200" rx="150" ry="60" fill="#4fc3f7" opacity="0.05"/>
  <ellipse cx="400" cy="200" rx="100" ry="40" fill="#7c4dff" opacity="0.05"/>
</svg>