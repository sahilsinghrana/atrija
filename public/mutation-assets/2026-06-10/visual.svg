<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <!-- Aurora gradient bands -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="40%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6bb5ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="600" fill="url(#sky)"/>

  <!-- Distant stars -->
  <g opacity="0.7">
    <circle cx="100" cy="50" r="1.5" fill="#fde68a"/>
    <circle cx="250" cy="30" r="1" fill="#fffbeb"/>
    <circle cx="400" cy="70" r="1.2" fill="#fde68a"/>
    <circle cx="550" cy="20" r="1.5" fill="#fffbeb"/>
    <circle cx="700" cy="55" r="1" fill="#fde68a"/>
    <circle cx="850" cy="35" r="1.3" fill="#fffbeb"/>
    <circle cx="950" cy="60" r="1" fill="#fde68a"/>
    <circle cx="1100" cy="40" r="1.5" fill="#fde68a"/>
    <circle cx="150" cy="90" r="0.8" fill="#fffbeb"/>
    <circle cx="350" cy="100" r="0.7" fill="#fde68a"/>
    <circle cx="600" cy="85" r="1.1" fill="#fffbeb"/>
    <circle cx="800" cy="95" r="0.9" fill="#fde68a"/>
    <circle cx="1050" cy="75" r="1" fill="#fffbeb"/>
  </g>

  <!-- Aurora band 1 — wide green/purple curtains -->
  <g filter="url(#glow)" opacity="0.8">
    <path d="M0,120 C100,80 200,160 350,130 C500,100 600,170 750,140 C900,110 1000,180 1200,150 L1200,250 C1000,220 900,280 750,260 C600,240 500,290 350,270 C200,250 100,300 0,270 Z" fill="url(#aurora1)"/>
  </g>

  <!-- Aurora band 2 — pink/green shimmer -->
  <g filter="url(#glow)" opacity="0.6">
    <path d="M0,180 C150,150 300,220 450,190 C600,160 750,230 900,200 C1050,170 1150,240 1200,220 L1200,310 C1150,290 1050,340 900,320 C750,300 600,350 450,330 C300,310 150,360 0,340 Z" fill="url(#aurora2)"/>
  </g>

  <!-- Aurora band 3 — blue/purple wisps -->
  <g filter="url(#glow)" opacity="0.5">
    <path d="M0,250 C200,220 400,280 600,260 C800,240 1000,300 1200,280 L1200,360 C1000,340 800,380 600,360 C400,340 200,380 0,370 Z" fill="url(#aurora3)"/>
  </g>

  <!-- Bright aurora streaks — brushstroke style -->
  <g filter="url(#softGlow)" opacity="0.7">
    <path d="M50,200 Q200,160 350,210 Q500,260 650,200 Q800,140 950,210 Q1100,280 1180,230" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30,240 Q180,200 330,250 Q480,300 630,240 Q780,180 930,250 Q1080,320 1170,270" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M70,280 Q220,250 370,300 Q520,350 670,290 Q820,230 970,300 Q1120,370 1190,320" stroke="#14b8a6" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M20,310 Q170,280 320,330 Q470,380 620,320 Q770,260 920,330 Q1070,400 1160,350" stroke="#ec4899" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Impressionist brushstroke texture dots in aurora colors -->
  <g opacity="0.4">
    <!-- Green brushstrokes -->
    <circle cx="200" cy="180" r="4" fill="#22c55e"/>
    <circle cx="220" cy="175" r="3" fill="#16a34a"/>
    <circle cx="400" cy="200" r="5" fill="#22c55e"/>
    <circle cx="420" cy="195" r="3.5" fill="#14b8a6"/>
    <circle cx="600" cy="170" r="4" fill="#22c55e"/>
    <circle cx="620" cy="165" r="3" fill="#16a34a"/>
    <circle cx="800" cy="190" r="5" fill="#14b8a6"/>
    <circle cx="820" cy="185" r="4" fill="#22c55e"/>
    <circle cx="1000" cy="200" r="4" fill="#22c55e"/>
    <!-- Purple brushstrokes -->
    <circle cx="300" cy="220" r="4" fill="#a855f7"/>
    <circle cx="320" cy="215" r="3" fill="#8b5cf6"/>
    <circle cx="500" cy="240" r="5" fill="#a855f7"/>
    <circle cx="520" cy="235" r="3.5" fill="#8b5cf6"/>
    <circle cx="700" cy="210" r="4" fill="#a855f7"/>
    <circle cx="720" cy="205" r="3" fill="#c084fc"/>
    <circle cx="900" cy="230" r="5" fill="#8b5cf6"/>
    <circle cx="920" cy="225" r="4" fill="#a855f7"/>
    <!-- Pink brushstrokes -->
    <circle cx="450" cy="280" r="3" fill="#ec4899"/>
    <circle cx="470" cy="275" r="2.5" fill="#f472b6"/>
    <circle cx="650" cy="260" r="4" fill="#ec4899"/>
    <circle cx="670" cy="255" r="3" fill="#f472b6"/>
    <circle cx="850" cy="280" r="3.5" fill="#ec4899"/>
    <!-- Gold/amber accents -->
    <circle cx="350" cy="150" r="2.5" fill="#fde68a" opacity="0.8"/>
    <circle cx="550" cy="130" r="3" fill="#fbbf24" opacity="0.7"/>
    <circle cx="750" cy="155" r="2.5" fill="#fde68a" opacity="0.8"/>
    <circle cx="950" cy="140" r="3" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- Silhouette landscape at bottom — rolling hills -->
  <path d="M0,450 C100,420 200,460 350,440 C500,420 600,455 750,435 C900,415 1000,450 1200,440 L1200,600 L0,600 Z" fill="#0a0a1a" opacity="0.9"/>
  <path d="M0,480 C150,460 300,500 450,485 C600,470 750,505 900,490 C1050,475 1150,500 1200,495 L1200,600 L0,600 Z" fill="#08080f"/>

  <!-- Foreground grass/trees silhouette -->
  <g opacity="0.95">
    <!-- Cypress-like tree silhouettes -->
    <path d="M80,600 L85,500 Q90,460 80,440 Q75,460 80,500 L75,600 Z" fill="#050510"/>
    <path d="M150,600 L155,510 Q160,470 150,455 Q145,475 150,510 L145,600 Z" fill="#050510"/>
    <path d="M1050,600 L1055,495 Q1060,455 1050,435 Q1045,455 1050,495 L1045,600 Z" fill="#050510"/>
    <path d="M1120,600 L1125,520 Q1130,480 1120,460 Q1115,480 1120,520 L1115,600 Z" fill="#050510"/>
    <!-- Small tree cluster -->
    <path d="M1150,600 L1153,540 Q1156,510 1150,500 Q1147,515 1150,540 L1147,600 Z" fill="#050510"/>
  </g>

  <!-- Bright foreground aurora reflection -->
  <g opacity="0.3">
    <ellipse cx="300" cy="500" rx="120" ry="30" fill="#22c55e" filter="url(#glow)"/>
    <ellipse cx="700" cy="510" rx="150" ry="25" fill="#a855f7" filter="url(#glow)"/>
    <ellipse cx="1000" cy="505" rx="100" ry="20" fill="#14b8a6" filter="url(#glow)"/>
  </g>

  <!-- Impressionist texture overlay — scattered bright dots -->
  <g opacity="0.25">
    <circle cx="100" cy="150" r="2" fill="#fde68a"/>
    <circle cx="300" cy="130" r="1.5" fill="#fbbf24"/>
    <circle cx="500" cy="120" r="2" fill="#fde68a"/>
    <circle cx="700" cy="140" r="1.5" fill="#fbbf24"/>
    <circle cx="900" cy="125" r="2" fill="#fde68a"/>
    <circle cx="1100" cy="135" r="1.5" fill="#fbbf2a"/>
    <!-- Green dots scattered -->
    <circle cx="150" cy="200" r="1.5" fill="#22c55e"/>
    <circle cx="350" cy="185" r="2" fill="#16a34a"/>
    <circle cx="550" cy="205" r="1.5" fill="#22c55e"/>
    <circle cx="750" cy="190" r="2" fill="#14b8a6"/>
    <circle cx="950" cy="210" r="1.5" fill="#22c55e"/>
    <circle cx="250" cy="250" r="1.5" fill="#a855f7"/>
    <circle cx="450" cy="235" r="2" fill="#8b5cf6"/>
    <circle cx="650" cy="255" r="1.5" fill="#a855f7"/>
    <circle cx="850" cy="240" r="2" fill="#c084fc"/>
    <circle cx="1050" cy="260" r="1.5" fill="#a855f7"/>
    <circle cx="400" cy="300" r="1.5" fill="#ec4899"/>
    <circle cx="600" cy="285" r="2" fill="#f472b6"/>
    <circle cx="800" cy="305" r="1.5" fill="#ec4899"/>
    <circle cx="1000" cy="290" r="2" fill="#f472b6"/>
  </g>
</svg>