    <circle cx="592" cy="245" r="28" fill="#d97706"/>
    <circle cx="592" cy="245" r="19" fill="#b45309"/>
    <circle cx="592" cy="245" r="11" fill="#92400e"/>
    <g fill="#fbbf24" opacity="0.95">
      <ellipse cx="592" cy="215" rx="9" ry="18" transform="rotate(0,592,245)"/>
      <ellipse cx="614" cy="225" rx="9" ry="18" transform="rotate(40,592,245)"/>
      <ellipse cx="618" cy="248" rx="9" ry="18" transform="rotate(78,592,245)"/>
      <ellipse cx="608" cy="268" rx="9" ry="18" transform="rotate(125,592,245)"/>
      <ellipse cx="582" cy="270" rx="9" ry="18" transform="rotate(175,592,245)"/>
      <ellipse cx="564" cy="256" rx="9" ry="18" transform="rotate(225,592,245)"/>
      <ellipse cx="562" cy="234" rx="9" ry="18" transform="rotate(270,592,245)"/>
      <ellipse cx="572" cy="216" rx="9" ry="18" transform="rotate(315,592,245)"/>
