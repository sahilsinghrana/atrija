<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <filter id="brush">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="40%" stop-color="#2d1b69"/>
      <stop offset="70%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#6bb5ff"/>
    </linearGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cometHead" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1200" height="600" fill="url(#sky)"/>

  <!-- Stars - bright scattered points -->
  <g filter="url(#glow)">
    <circle cx="100" cy="50" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="250" cy="80" r="1.5" fill="#e0e7ff" opacity="0.8"/>
    <circle cx="400" cy="30" r="2.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="550" cy="90" r="1.8" fill="#fef3c7" opacity="0.85"/>
    <circle cx="700" cy="40" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="850" cy="70" r="1.5" fill="#e0e7ff" opacity="0.8"/>
    <circle cx="950" cy="20" r="2.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="1100" cy="60" r="1.8" fill="#fef3c7" opacity="0.85"/>
    <circle cx="150" cy="120" r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="350" cy="150" r="1.5" fill="#e0e7ff" opacity="0.75"/>
    <circle cx="600" cy="130" r="1.8" fill="#ffffff" opacity="0.8"/>
    <circle cx="800" cy="110" r="1.3" fill="#fef3c7" opacity="0.7"/>
    <circle cx="1000" cy="140" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="50" cy="180" r="1.5" fill="#e0e7ff" opacity="0.7"/>
    <circle cx="500" cy="170" r="1.2" fill="#ffffff" opacity="0.65"/>
    <circle cx="750" cy="160" r="1.6" fill="#fef3c7" opacity="0.75"/>
    <circle cx="1150" cy="100" r="1.4" fill="#ffffff" opacity="0.8"/>
    <circle cx="180" cy="220" r="1" fill="#e0e7ff" opacity="0.6"/>
    <circle cx="650" cy="200" r="1.3" fill="#ffffff" opacity="0.7"/>
    <circle cx="900" cy="190" r="1.5" fill="#fef3c7" opacity="0.7"/>
    <circle cx="300" cy="250" r="1.2" fill="#ffffff" opacity="0.65"/>
    <circle cx="1050" cy="230" r="1.8" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Comet trail - long sweeping arc -->
  <g filter="url(#brush)">
    <!-- Main trail -->
    <path d="M100,500 Q200,420 350,350 Q500,280 650,220 Q800,160 950,120 Q1050,95 1150,80" stroke="url(#trail)" stroke-width="40" fill="none" opacity="0.6"/>
    <path d="M100,500 Q200,420 350,350 Q500,280 650,220 Q800,160 950,120 Q1050,95 1150,80" stroke="#fbbf24" stroke-width="8" fill="none" opacity="0.4"/>
    <!-- Secondary wisps -->
    <path d="M100,500 Q250,430 400,370 Q550,310 700,260 Q850,210 1000,170" stroke="#ec4899" stroke-width="3" fill="none" opacity="0.2"/>
    <path d="M200,480 Q350,400 500,320 Q650,250 800,190 Q950,140 1100,100" stroke="#8b5cf6" stroke-width="4" fill="none" opacity="0.15"/>
  </g>

  <!-- Comet head - bright glowing orb -->
  <g filter="url(#glow)">
    <circle cx="1150" cy="80" r="35" fill="url(#cometHead)" opacity="0.95"/>
    <circle cx="1150" cy="80" r="20" fill="#ffffff" opacity="0.9"/>
    <circle cx="1150" cy="80" r="10" fill="#ffffff" opacity="1"/>
  </g>

  <!-- Sparkle particles along trail -->
  <g filter="url(#glow)">
    <circle cx="300" cy="380" r="3" fill="#fde68a" opacity="0.8"/>
    <circle cx="450" cy="310" r="2.5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="600" cy="250" r="3.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="750" cy="195" r="2" fill="#fde68a" opacity="0.7"/>
    <circle cx="900" cy="145" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="1000" cy="115" r="2" fill="#ffffff" opacity="0.75"/>
    <circle cx="350" cy="360" r="1.5" fill="#ec4899" opacity="0.5"/>
    <circle cx="550" cy="275" r="2" fill="#8b5cf6" opacity="0.5"/>
    <circle cx="700" cy="230" r="1.8" fill="#fde68a" opacity="0.6"/>
    <circle cx="850" cy="170" r="2.5" fill="#fbbf24" opacity="0.65"/>
  </g>

  <!-- Impressionist brushstroke texture overlays -->
  <g opacity="0.15" filter="url(#brush)">
    <ellipse cx="200" cy="450" rx="80" ry="15" fill="#fbbf24" transform="rotate(-25 200 450)"/>
    <ellipse cx="500" cy="320" rx="100" ry="12" fill="#fde68a" transform="rotate(-20 500 320)"/>
    <ellipse cx="800" cy="200" rx="90" ry="10" fill="#f59e0b" transform="rotate(-15 800 200)"/>
    <ellipse cx="1000" cy="130" rx="70" ry="8" fill="#ffffff" transform="rotate(-10 1000 130)"/>
  </g>

  <!-- Foreground silhouette - subtle dark ground -->
  <path d="M0,520 Q150,490 300,510 Q450,530 600,505 Q750,480 900,510 Q1050,540 1200,515 L1200,600 L0,600 Z" fill="#0a0a1a" opacity="0.6"/>

  <!-- Tiny flowers in foreground -->
  <g opacity="0.7">
    <circle cx="100" cy="540" r="4" fill="#ef4444"/>
    <circle cx="120" cy="535" r="3" fill="#f97316"/>
    <circle cx="250" cy="550" r="3.5" fill="#ec4899"/>
    <circle cx="400" cy="545" r="4" fill="#a855f7"/>
    <circle cx="550" cy="555" r="3" fill="#ef4444"/>
    <circle cx="700" cy="548" r="3.5" fill="#f97316"/>
    <circle cx="850" cy="552" r="4" fill="#ec4899"/>
    <circle cx="1000" cy="545" r="3" fill="#a855f7"/>
    <circle cx="1100" cy="550" r="3.5" fill="#ef4444"/>
    <!-- Stems -->
    <line x1="100" y1="540" x2="100" y2="560" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="250" y1="550" x2="250" y2="570" stroke="#14b8a6" stroke-width="1.5"/>
    <line x1="400" y1="545" x2="400" y2="565" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="700" y1="548" x2="700" y2="568" stroke="#14b8a6" stroke-width="1.5"/>
    <line x1="1000" y1="545" x2="1000" y2="565" stroke="#22c55e" stroke-width="1.5"/>
  </g>
</svg>