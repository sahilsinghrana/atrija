<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="width:100%;height:auto;display:block">
  <defs>
    <!-- Sky gradient: deep crimson to warm amber -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="30%" stop-color="#3a0e10"/>
      <stop offset="60%" stop-color="#6a1a1a"/>
      <stop offset="85%" stop-color="#a03020"/>
      <stop offset="100%" stop-color="#d45020"/>
    </linearGradient>
    <!-- Ember glow radial -->
    <radialGradient id="emberGlow" cx="50%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ff4081" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a0808" stop-opacity="0"/>
    </radialGradient>
    <!-- Phoenix body gradient -->
    <linearGradient id="phoenixBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="40%" stop-color="#ff4081"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <!-- Wing fire gradient -->
    <linearGradient id="wingFire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <!-- Spark glow -->
    <radialGradient id="sparkGlow">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <!-- Flame filter for painterly effect -->
    <filter id="painterly">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- Distant ember particles in sky -->
  <g opacity="0.4">
    <circle cx="120" cy="80" r="2" fill="#ff6b35"/>
    <circle cx="250" cy="50" r="1.5" fill="#ffd54f"/>
    <circle cx="380" cy="90" r="2.5" fill="#ff4081"/>
    <circle cx="500" cy="40" r="1.8" fill="#ff6b35"/>
    <circle cx="620" cy="70" r="2" fill="#ffd54f"/>
    <circle cx="700" cy="55" r="1.5" fill="#ff4081"/>
    <circle cx="180" cy="120" r="1.2" fill="#ff6b35"/>
    <circle cx="560" cy="110" r="1.8" fill="#ffd54f"/>
    <circle cx="340" cy="60" r="1" fill="#ff4081"/>
    <circle cx="450" cy="130" r="1.5" fill="#ff6b35"/>
  </g>

  <!-- Rolling flame clouds at horizon -->
  <g filter="url(#painterly)" opacity="0.5">
    <ellipse cx="200" cy="320" rx="180" ry="40" fill="#a03020"/>
    <ellipse cx="400" cy="330" rx="200" ry="50" fill="#8a2515"/>
    <ellipse cx="600" cy="315" rx="160" ry="45" fill="#b03828"/>
    <ellipse cx="100" cy="340" rx="120" ry="30" fill="#7a1a10"/>
    <ellipse cx="700" cy="340" rx="140" ry="35" fill="#902818"/>
  </g>

  <!-- Central ember glow -->
  <rect width="800" height="400" fill="url(#emberGlow)"/>

  <!-- Phoenix rising from flames -->
  <g transform="translate(400, 250)" filter="url(#softGlow)">
    <!-- Left wing -->
    <g transform="rotate(-20)">
      <path d="M0,0 Q-80,-60 -140,-40 Q-120,-70 -160,-50 Q-130,-80 -170,-55 Q-140,-90 -180,-60 Q-150,-95 -190,-65 Q-155,-100 -195,-70 Q-160,-105 -200,-75 Q-150,-80 -120,-40 Q-90,-20 0,0" 
            fill="url(#wingFire)" opacity="0.9"/>
      <path d="M0,0 Q-60,-80 -120,-70 Q-90,-100 -140,-85 Q-100,-115 -150,-95 Q-110,-125 -160,-100 Q-115,-130 -165,-105 Q-120,-135 -170,-110 Q-100,-100 -70,-60 Q-40,-30 0,0" 
            fill="#ff4081" opacity="0.6"/>
    </g>
    <!-- Right wing -->
    <g transform="rotate(20) scale(-1,1)">
      <path d="M0,0 Q-80,-60 -140,-40 Q-120,-70 -160,-50 Q-130,-80 -170,-55 Q-140,-90 -180,-60 Q-150,-95 -190,-65 Q-155,-100 -195,-70 Q-160,-105 -200,-75 Q-150,-80 -120,-40 Q-90,-20 0,0" 
            fill="url(#wingFire)" opacity="0.9"/>
      <path d="M0,0 Q-60,-80 -120,-70 Q-90,-100 -140,-85 Q-100,-115 -150,-95 Q-110,-125 -160,-100 Q-115,-130 -165,-105 Q-120,-135 -170,-110 Q-100,-100 -70,-60 Q-40,-30 0,0" 
            fill="#ff4081" opacity="0.6"/>
    </g>
    <!-- Tail feathers -->
    <g>
      <path d="M0,30 Q-20,80 -40,120 Q-30,90 -50,130 Q-35,95 -55,135 Q-40,100 -60,140" 
            stroke="#ff6b35" stroke-width="3" fill="none" opacity="0.7"/>
      <path d="M0,30 Q10,85 20,125 Q15,95 30,135 Q20,100 40,140" 
            stroke="#ff4081" stroke-width="2.5" fill="none" opacity="0.6"/>
      <path d="M0,30 Q-5,90 -10,130 Q-8,100 -15,140" 
            stroke="#ffd54f" stroke-width="2" fill="none" opacity="0.5"/>
    </g>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="25" ry="35" fill="url(#phoenixBody)" opacity="0.95"/>
    <!-- Head -->
    <circle cx="0" cy="-40" r="12" fill="#ffd54f"/>
    <!-- Crown feathers -->
    <path d="M-5,-50 Q-15,-75 -8,-85" stroke="#ff6b35" stroke-width="2" fill="none"/>
    <path d="M0,-52 Q0,-80 2,-90" stroke="#ff4081" stroke-width="2" fill="none"/>
    <path d="M5,-50 Q15,-75 10,-85" stroke="#ffd54f" stroke-width="2" fill="none"/>
  </g>

  <!-- Rising sparks and embers -->
  <g>
    <!-- Large sparks -->
    <circle cx="350" cy="180" r="4" fill="#ffd54f" filter="url(#sparkGlow)"/>
    <circle cx="450" cy="160" r="3.5" fill="#ff6b35" filter="url(#sparkGlow)"/>
    <circle cx="380" cy="200" r="3" fill="#ff4081" filter="url(#sparkGlow)"/>
    <circle cx="420" cy="140" r="4.5" fill="#ffd54f" filter="url(#sparkGlow)"/>
    <circle cx="320" cy="220" r="2.5" fill="#ff6b35" filter="url(#sparkGlow)"/>
    <circle cx="480" cy="190" r="3" fill="#ffd54f" filter="url(#sparkGlow)"/>
    <!-- Small scattered sparks -->
    <circle cx="300" cy="150" r="1.5" fill="#ffd54f" opacity="0.8"/>
    <circle cx="500" cy="170" r="1.8" fill="#ff6b35" opacity="0.7"/>
    <circle cx="280" cy="200" r="1.2" fill="#ff4081" opacity="0.6"/>
    <circle cx="520" cy="140" r="1.5" fill="#ffd54f" opacity="0.8"/>
    <circle cx="340" cy="120" r="1" fill="#ff6b35" opacity="0.7"/>
    <circle cx="460" cy="110" r="1.3" fill="#ffd54f" opacity="0.6"/>
    <circle cx="370" cy="90" r="1.5" fill="#ff4081" opacity="0.5"/>
    <circle cx="430" cy="80" r="1" fill="#ffd54f" opacity="0.7"/>
    <!-- Tiny distant sparks -->
    <circle cx="250" cy="100" r="0.8" fill="#ff6b35" opacity="0.5"/>
    <circle cx="550" cy="90" r="0.9" fill="#ffd54f" opacity="0.4"/>
    <circle cx="200" cy="150" r="0.7" fill="#ff4081" opacity="0.5"/>
    <circle cx="600" cy="130" r="0.8" fill="#ff6b35" opacity="0.4"/>
    <circle cx="150" cy="180" r="0.6" fill="#ffd54f" opacity="0.3"/>
    <circle cx="650" cy="160" r="0.7" fill="#ff6b35" opacity="0.4"/>
  </g>

  <!-- Foreground flame wisps -->
  <g filter="url(#painterly)" opacity="0.4">
    <path d="M50,400 Q60,350 70,380 Q80,320 90,360 Q100,300 110,350 Q120,310 130,340 L130,400 Z" fill="#ff6b35"/>
    <path d="M650,400 Q660,340 670,370 Q680,310 690,350 Q700,300 710,340 Q720,320 730,360 L730,400 Z" fill="#ff4081"/>
    <path d="M150,400 Q160,370 170,390 Q180,350 190,380 L190,400 Z" fill="#ffd54f"/>
    <path d="M580,400 Q590,360 600,385 Q610,340 620,375 L620,400 Z" fill="#ff6b35"/>
  </g>

  <!-- Bottom glow -->
  <rect x="0" y="350" width="800" height="50" fill="url(#emberGlow)" opacity="0.3"/>
</svg>