<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffd54f" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ff8f00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6f00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skyGrad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="40%" stop-color="#42a5f5"/>
      <stop offset="70%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </radialGradient>
    <filter id="impressionist">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Sun glow (large atmospheric) -->
  <circle cx="400" cy="220" r="200" fill="url(#sunGlow)" opacity="0.9"/>

  <!-- Sun core -->
  <circle cx="400" cy="220" r="55" fill="#fff8e1" filter="url(#softGlow)"/>
  <circle cx="400" cy="220" r="40" fill="#fffde7"/>

  <!-- Sun rays - impressionist brushstrokes -->
  <g opacity="0.4" filter="url(#impressionist)">
    <ellipse cx="400" cy="120" rx="8" ry="30" fill="#ffd54f" transform="rotate(0,400,220)"/>
    <ellipse cx="400" cy="120" rx="6" ry="25" fill="#ffab40" transform="rotate(20,400,220)"/>
    <ellipse cx="400" cy="120" rx="7" ry="28" fill="#ffd54f" transform="rotate(40,400,220)"/>
    <ellipse cx="400" cy="120" rx="5" ry="22" fill="#ffe082" transform="rotate(60,400,220)"/>
    <ellipse cx="400" cy="120" rx="8" ry="32" fill="#ffd54f" transform="rotate(80,400,220)"/>
    <ellipse cx="400" cy="120" rx="6" ry="26" fill="#ffab40" transform="rotate(100,400,220)"/>
    <ellipse cx="400" cy="120" rx="7" ry="30" fill="#ffd54f" transform="rotate(120,400,220)"/>
    <ellipse cx="400" cy="120" rx="5" ry="24" fill="#ffe082" transform="rotate(140,400,220)"/>
    <ellipse cx="400" cy="120" rx="8" ry="28" fill="#ffd54f" transform="rotate(160,400,220)"/>
    <ellipse cx="400" cy="120" rx="6" ry="30" fill="#ffab40" transform="rotate(180,400,220)"/>
    <ellipse cx="400" cy="120" rx="7" ry="26" fill="#ffd54f" transform="rotate(200,400,220)"/>
    <ellipse cx="400" cy="120" rx="5" ry="28" fill="#ffe082" transform="rotate(220,400,220)"/>
    <ellipse cx="400" cy="120" rx="8" ry="32" fill="#ffd54f" transform="rotate(240,400,220)"/>
    <ellipse cx="400" cy="120" rx="6" ry="24" fill="#ffab40" transform="rotate(260,400,220)"/>
    <ellipse cx="400" cy="120" rx="7" ry="30" fill="#ffd54f" transform="rotate(280,400,220)"/>
    <ellipse cx="400" cy="120" rx="5" ry="26" fill="#ffe082" transform="rotate(300,400,220)"/>
    <ellipse cx="400" cy="120" rx="8" ry="28" fill="#ffd54f" transform="rotate(320,400,220)"/>
    <ellipse cx="400" cy="120" rx="6" ry="32" fill="#ffab40" transform="rotate(340,400,220)"/>
  </g>

  <!-- Heat shimmer waves -->
  <g opacity="0.15" fill="none" stroke="#fff8e1" stroke-width="2">
    <path d="M0,320 Q100,310 200,320 Q300,330 400,315 Q500,300 600,320 Q700,340 800,320"/>
    <path d="M0,340 Q100,330 200,345 Q300,360 400,340 Q500,320 600,345 Q700,370 800,340"/>
    <path d="M0,360 Q100,355 200,365 Q300,375 400,355 Q500,335 600,365 Q700,395 800,360"/>
  </g>

  <!-- Sunflower field at bottom -->
  <g>
    <!-- Stems -->
    <g stroke="#2e7d32" stroke-width="2" opacity="0.7">
      <line x1="80" y1="500" x2="85" y2="380"/>
      <line x1="160" y1="500" x2="155" y2="370"/>
      <line x1="250" y1="500" x2="255" y2="360"/>
      <line x1="340" y1="500" x2="338" y2="350"/>
      <line x1="460" y1="500" x2="462" y2="355"/>
      <line x1="550" y1="500" x2="548" y2="365"/>
      <line x1="640" y1="500" x2="642" y2="375"/>
      <line x1="720" y1="500" x2="718" y2="385"/>
    </g>

    <!-- Leaves -->
    <g fill="#388e3c" opacity="0.5">
      <ellipse cx="75" cy="430" rx="18" ry="8" transform="rotate(-20,75,430)"/>
      <ellipse cx="165" cy="420" rx="16" ry="7" transform="rotate(15,165,420)"/>
      <ellipse cx="245" cy="410" rx="18" ry="8" transform="rotate(-25,245,410)"/>
      <ellipse cx="345" cy="400" rx="16" ry="7" transform="rotate(20,345,400)"/>
      <ellipse cx="455" cy="405" rx="18" ry="8" transform="rotate(-15,455,405)"/>
      <ellipse cx="555" cy="415" rx="16" ry="7" transform="rotate(25,555,415)"/>
      <ellipse cx="635" cy="425" rx="18" ry="8" transform="rotate(-20,635,425)"/>
      <ellipse cx="725" cy="435" rx="16" ry="7" transform="rotate(15,725,435)"/>
    </g>

    <!-- Sunflower heads (impressionist dabs) -->
    <!-- Flower 1 -->
    <g transform="translate(85,370)">
      <circle r="22" fill="#5d4037"/>
      <circle r="18" fill="#f9a825"/>
      <g fill="#f5c800" opacity="0.8">
        <circle cx="0" cy="-14" r="5" transform="rotate(0)"/>
        <circle cx="12" cy="-7" r="5" transform="rotate(45)"/>
        <circle cx="14" cy="3" r="5" transform="rotate(90)"/>
        <circle cx="8" cy="12" r="5" transform="rotate(135)"/>
        <circle cx="-3" cy="14" r="5" transform="rotate(180)"/>
        <circle cx="-12" cy="7" r="5" transform="rotate(225)"/>
        <circle cx="-14" cy="-3" r="5" transform="rotate(270)"/>
        <circle cx="-8" cy="-12" r="5" transform="rotate(315)"/>
      </g>
      <circle r="8" fill="#ff8f00" opacity="0.6"/>
    </g>

    <!-- Flower 2 -->
    <g transform="translate(155,360)">
      <circle r="24" fill="#5d4037"/>
      <circle r="20" fill="#f9a825"/>
      <g fill="#f5c800" opacity="0.8">
        <circle cx="0" cy="-15" r="5.5" transform="rotate(10)"/>
        <circle cx="13" cy="-8" r="5.5" transform="rotate(55)"/>
        <circle cx="15" cy="4" r="5.5" transform="rotate(100)"/>
        <circle cx="9" cy="13" r="5.5" transform="rotate(145)"/>
        <circle cx="-4" cy="15" r="5.5" transform="rotate(190)"/>
        <circle cx="-13" cy="8" r="5.5" transform="rotate(235)"/>
        <circle cx="-15" cy="-4" r="5.5" transform="rotate(280)"/>
        <circle cx="-9" cy="-13" r="5.5" transform="rotate(325)"/>
      </g>
      <circle r="9" fill="#ff8f00" opacity="0.6"/>
    </g>

    <!-- Flower 3 -->
    <g transform="translate(255,350)">
      <circle r="26" fill="#5d4037"/>
      <circle r="22" fill="#f9a825"/>
      <g fill="#f5c800" opacity="0.8">
        <circle cx="0" cy="-17" r="6" transform="rotate(5)"/>
        <circle cx="15" cy="-9" r="6" transform="rotate(50)"/>
        <circle cx="17" cy="4" r="6" transform="rotate(95)"/>
        <circle cx="10" cy="15" r="6" transform="rotate(140)"/>
        <circle cx="-4" cy="17" r="6" transform="rotate(185)"/>
        <circle cx="-15" cy="9" r="6" transform="rotate(230)"/>
        <circle cx="-17" cy="-4" r="6" transform="rotate(275)"/>
        <circle cx="-10" cy="-15" r="6" transform="rotate(320)"/>
      </g>
      <circle r="10" fill="#ff8f00" opacity="0.6"/>
    </g>

    <!-- Flower 4 -->
    <g transform="translate(338,340)">
      <circle r="24" fill="#5d4037"/>
      <circle r="20" fill="#f9a825"/>
      <g fill="#f5c800" opacity="0.8">
        <circle cx="0" cy="-15" r="5.5" transform="rotate(15)"/>
        <circle cx="13" cy="-8" r="5.5" transform="rotate(60)"/>
        <circle cx="15" cy="4" r="5.5" transform="rotate(105)"/>
        <circle cx="9" cy="13" r="5.5" transform="rotate(150)"/>
        <circle cx="-4" cy="15" r="5.5" transform="rotate(195)"/>
        <circle cx="-13" cy="8" r="5.5" transform="rotate(240)"/>
        <circle cx="-15" cy="-4" r="5.5" transform="rotate(285)"/>
        <circle cx="-9" cy="-13" r="5.5" transform="rotate(330)"/>
      </g>
      <circle r="9" fill="#ff8f00" opacity="0.6"/>
    </g>

    <!-- Flower 5 -->
    <g transform="translate(462,345)">
      <circle r="25" fill="#5d4037"/>
      <circle r="21" fill="#f9a825"/>
      <g fill="#f5c800" opacity="0.8">
        <circle cx="0" cy="-16" r="5.5" transform="rotate(8)"/>
        <circle cx="14" cy="-8" r="5.5" transform="rotate(53)"/>
        <circle cx="16" cy="4" r="5.5" transform="rotate(98)"/>
        <circle cx="9" cy="14" r="5.5" transform="rotate(143)"/>
        <circle cx="-4" cy="16" r="5.5" transform="rotate(188)"/>
        <circle cx="-14" cy="8" r="5.5" transform="rotate(233)"/>
        <circle cx="-16" cy="-4" r="5.5" transform="rotate(278)"/>
        <circle cx="-9" cy="-14" r="5.5" transform="rotate(323)"/>
      </g>
      <circle r="9" fill="#ff8f00" opacity="0.6"/>
    </g>

    <!-- Flower 6 -->
    <g transform="translate(548,355)">
      <circle r="23" fill="#5d4037"/>
      <circle r="19" fill="#f9a825"/>
      <g fill="#f5c800" opacity="0.8">
        <circle cx="0" cy="-14" r="5" transform="rotate(12)"/>
        <circle cx="12" cy="-7" r="5" transform="rotate(57)"/>
        <circle cx="14" cy="3" r="5" transform="rotate(102)"/>
        <circle cx="8" cy="12" r="5" transform="rotate(147)"/>
        <circle cx="-3" cy="14" r="5" transform="rotate(192)"/>
        <circle cx="-12" cy="7" r="5" transform="rotate(237)"/>
        <circle cx="-14" cy="-3" r="5" transform="rotate(282)"/>
        <circle cx="-8" cy="-12" r="5" transform="rotate(327)"/>
      </g>
      <circle r="8" fill="#ff8f00" opacity="0.6"/>
    </g>

    <!-- Flower 7 -->
    <g transform="translate(642,365)">
      <circle r="22" fill="#5d4037"/>
      <circle r="18" fill="#f9a825"/>
      <g fill="#f5c800" opacity="0.8">
        <circle cx="0" cy="-13" r="5" transform="rotate(3)"/>
        <circle cx="11" cy="-7" r="5" transform="rotate(48)"/>
        <circle cx="13" cy="3" r="5" transform="rotate(93)"/>
        <circle cx="7" cy="11" r="5" transform="rotate(138)"/>
        <circle cx="-3" cy="13" r="5" transform="rotate(183)"/>
        <circle cx="-11" cy="7" r="5" transform="rotate(228)"/>
        <circle cx="-13" cy="-3" r="5" transform="rotate(273)"/>
        <circle cx="-7" cy="-11" r="5" transform="rotate(318)"/>
      </g>
      <circle r="8" fill="#ff8f00" opacity="0.6"/>
    </g>

    <!-- Flower 8 -->
    <g transform="translate(718,375)">
      <circle r="20" fill="#5d4037"/>
      <circle r="16" fill="#f9a825"/>
      <g fill="#f5c800" opacity="0.8">
        <circle cx="0" cy="-12" r="4.5" transform="rotate(18)"/>
        <circle cx="10" cy="-6" r="4.5" transform="rotate(63)"/>
        <circle cx="12" cy="2" r="4.5" transform="rotate(108)"/>
        <circle cx="6" cy="10" r="4.5" transform="rotate(153)"/>
        <circle cx="-2" cy="12" r="4.5" transform="rotate(198)"/>
        <circle cx="-10" cy="6" r="4.5" transform="rotate(243)"/>
        <circle cx="-12" cy="-2" r="4.5" transform="rotate(288)"/>
        <circle cx="-6" cy="-10" r="4.5" transform="rotate(333)"/>
      </g>
      <circle r="7" fill="#ff8f00" opacity="0.6"/>
    </g>
  </g>

  <!-- Floating light particles -->
  <g fill="#fff8e1" opacity="0.6">
    <circle cx="120" cy="150" r="2"/>
    <circle cx="280" cy="100" r="1.5"/>
    <circle cx="520" cy="130" r="2"/>
    <circle cx="650" cy="90" r="1.5"/>
    <circle cx="180" cy="200" r="1"/>
    <circle cx="600" cy="180" r="1.5"/>
    <circle cx="350" cy="80" r="1"/>
    <circle cx="450" cy="60" r="2"/>
    <circle cx="700" cy="150" r="1"/>
    <circle cx="50" cy="180" r="1.5"/>
  </g>

  <!-- Impressionist texture overlay -->
  <rect width="800" height="500" fill="url(#sunGlow)" opacity="0.05"/>
</svg>
