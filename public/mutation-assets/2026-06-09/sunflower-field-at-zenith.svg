      <ellipse cx="492" cy="210" rx="10" ry="19" transform="rotate(38,468,232)"/>
      <ellipse cx="497" cy="235" rx="10" ry="19" transform="rotate(72,468,232)"/>
      <ellipse cx="487" cy="258" rx="10" ry="19" transform="rotate(118,468,232)"/>
      <ellipse cx="460" cy="262" rx="10" ry="19" transform="rotate(165,468,232)"/>
      <ellipse cx="440" cy="248" rx="10" ry="19" transform="rotate(220,468,232)"/>
      <ellipse cx="438" cy="225" rx="10" ry="19" transform="rotate(265,468,232)"/>
      <ellipse cx="448" cy="205" rx="10" ry="19" transform="rotate(310,468,232)"/>
