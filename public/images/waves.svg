<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="50%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#000a12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sea)"/>
  <!-- Waves -->
  <g fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.3">
    <path d="M0,150 Q100,120 200,150 T400,150 T600,150 T800,150"/>
    <path d="M0,180 Q100,150 200,180 T400,180 T600,180 T800,180"/>
    <path d="M0,210 Q100,180 200,210 T400,210 T600,210 T800,210"/>
    <path d="M0,240 Q100,210 200,240 T400,240 T600,240 T800,240"/>
    <path d="M0,270 Q100,240 200,270 T400,270 T600,270 T800,270"/>
    <path d="M0,300 Q100,270 200,300 T400,300 T600,300 T800,300"/>
  </g>
  <!-- Foam -->
  <g fill="#b3e5fc" opacity="0.2">
    <ellipse cx="100" cy="155" rx="30" ry="5"/>
    <ellipse cx="300" cy="160" rx="40" ry="6"/>
    <ellipse cx="500" cy="145" rx="35" ry="5"/>
    <ellipse cx="700" cy="155" rx="30" ry="5"/>
  </g>
  <!-- Moon reflection -->
  <ellipse cx="400" cy="350" rx="60" ry="15" fill="#ffd54f" opacity="0.1"/>
  <ellipse cx="400" cy="350" rx="30" ry="8" fill="#ffd54f" opacity="0.15"/>
</svg>