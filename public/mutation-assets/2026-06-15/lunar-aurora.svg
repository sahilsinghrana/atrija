<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="skyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="40%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#060d17"/>
    </radialGradient>
    
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#ffd54f" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#80deea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Moon surface -->
    <radialGradient id="moonSurface" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="50%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </radialGradient>
    
    <!-- Aurora gradients -->
    <linearGradient id="aurora1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4fc3f7" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#80deea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="aurora2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#b388ff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#4fc3f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="aurora3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00c853" stop-opacity="0"/>
      <stop offset="50%" stop-color="#69f0ae" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Filter for impressionist brushstroke effect -->
    <filter id="brushTexture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="42" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sky background -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>
  
  <!-- Stars - scattered points of light -->
  <g opacity="0.8">
    <circle cx="120" cy="80" r="1.5" fill="#fff" opacity="0.9"/>
    <circle cx="250" cy="45" r="1" fill="#e8e8f0" opacity="0.7"/>
    <circle cx="380" cy="95" r="1.8" fill="#fff" opacity="0.85"/>
    <circle cx="500" cy="30" r="1.2" fill="#fff" opacity="0.6"/>
    <circle cx="620" cy="75" r="1.5" fill="#e8e8f0" opacity="0.8"/>
    <circle cx="700" cy="120" r="1" fill="#fff" opacity="0.7"/>
    <circle cx="80" cy="150" r="1.3" fill="#fff" opacity="0.75"/>
    <circle cx="180" cy="110" r="0.8" fill="#e8e8f0" opacity="0.5"/>
    <circle cx="340" cy="55" r="1" fill="#fff" opacity="0.65"/>
    <circle cx="450" cy="130" r="1.4" fill="#fff" opacity="0.8"/>
    <circle cx="560" cy="90" r="0.9" fill="#e8e8f0" opacity="0.6"/>
    <circle cx="670" cy="50" r="1.6" fill="#fff" opacity="0.9"/>
    <circle cx="750" cy="160" r="1.1" fill="#fff" opacity="0.7"/>
    <circle cx="50" cy="200" r="1" fill="#e8e8f0" opacity="0.55"/>
    <circle cx="200" cy="170" r="1.3" fill="#fff" opacity="0.7"/>
    <circle cx="310" cy="140" r="0.7" fill="#fff" opacity="0.5"/>
    <circle cx="420" cy="70" r="1.2" fill="#e8e8f0" opacity="0.65"/>
    <circle cx="530" cy="160" r="1" fill="#fff" opacity="0.6"/>
    <circle cx="640" cy="110" r="1.5" fill="#fff" opacity="0.8"/>
    <circle cx="720" cy="80" r="0.8" fill="#e8e8f0" opacity="0.5"/>
    <circle cx="150" cy="200" r="1.1" fill="#fff" opacity="0.7"/>
    <circle cx="280" cy="180" r="0.9" fill="#fff" opacity="0.6"/>
    <circle cx="470" cy="55" r="1.3" fill="#e8e8f0" opacity="0.75"/>
    <circle cx="590" cy="140" r="1" fill="#fff" opacity="0.65"/>
    <circle cx="760" cy="100" r="1.4" fill="#fff" opacity="0.8"/>
  </g>
  
  <!-- Aurora borealis curtains -->
  <g filter="url(#brushTexture)" opacity="0.7">
    <!-- Blue-green aurora curtain 1 -->
    <path d="M0,100 Q100,60 200,120 Q300,180 400,100 Q500,20 600,90 Q700,160 800,80 L800,200 Q700,240 600,180 Q500,120 400,200 Q300,280 200,220 Q100,160 0,220 Z" fill="url(#aurora1)" opacity="0.5"/>
    
    <!-- Violet aurora curtain 2 -->
    <path d="M0,140 Q150,80 300,150 Q450,220 600,130 Q700,60 800,120 L800,250 Q700,300 600,230 Q450,160 300,240 Q150,320 0,260 Z" fill="url(#aurora2)" opacity="0.4"/>
    
    <!-- Seafoam aurora curtain 3 -->
    <path d="M0,180 Q200,120 400,200 Q600,280 800,180 L800,320 Q600,380 400,300 Q200,220 0,300 Z" fill="url(#aurora3)" opacity="0.35"/>
  </g>
  
  <!-- Impressionist brushstroke texture overlay for aurora -->
  <g opacity="0.15" filter="url(#brushTexture)">
    <path d="M0,150 Q200,100 400,160 Q600,220 800,140" stroke="#4fc3f7" stroke-width="30" fill="none" opacity="0.3"/>
    <path d="M0,200 Q200,150 400,210 Q600,270 800,190" stroke="#7c4dff" stroke-width="25" fill="none" opacity="0.2"/>
    <path d="M0,120 Q200,80 400,140 Q600,200 800,120" stroke="#69f0ae" stroke-width="20" fill="none" opacity="0.2"/>
  </g>
  
  <!-- Moon outer glow -->
  <circle cx="400" cy="280" r="120" fill="url(#moonGlow)" opacity="0.6"/>
  <circle cx="400" cy="280" r="90" fill="url(#moonGlow)" opacity="0.4"/>
  
  <!-- Moon body -->
  <circle cx="400" cy="280" r="65" fill="url(#moonSurface)" filter="url(#softGlow)"/>
  
  <!-- Moon craters - impressionist style -->
  <g opacity="0.15">
    <ellipse cx="380" cy="260" rx="12" ry="10" fill="#b0a090"/>
    <ellipse cx="410" cy="290" rx="8" ry="7" fill="#b0a090"/>
    <ellipse cx="370" cy="295" rx="6" ry="5" fill="#b0a090"/>
    <ellipse cx="420" cy="255" rx="9" ry="8" fill="#b0a090"/>
    <ellipse cx="395" cy="310" rx="7" ry="6" fill="#b0a090"/>
    <ellipse cx="430" cy="275" rx="5" ry="4" fill="#b0a090"/>
  </g>
  
  <!-- Impressionist brushstroke highlights on moon -->
  <g opacity="0.2" filter="url(#brushTexture)">
    <path d="M360,250 Q380,240 400,255 Q420,270 440,250" stroke="#fff8e1" stroke-width="8" fill="none"/>
    <path d="M370,280 Q390,270 410,285 Q430,300 450,280" stroke="#ffd54f" stroke-width="6" fill="none" opacity="0.3"/>
  </g>
  
  <!-- Subtle golden rim light on moon -->
  <circle cx="400" cy="280" r="65" fill="none" stroke="#ffd54f" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Foreground stars with glow -->
  <g filter="url(#softGlow)">
    <circle cx="150" cy="60" r="2" fill="#fff" opacity="0.95"/>
    <circle cx="650" cy="40" r="2.5" fill="#ffd54f" opacity="0.9"/>
    <circle cx="300" cy="30" r="1.8" fill="#fff" opacity="0.85"/>
    <circle cx="550" cy="70" r="1.5" fill="#e8e8f0" opacity="0.8"/>
    <circle cx="720" cy="140" r="2" fill="#fff" opacity="0.9"/>
  </g>
  
  <!-- Bottom gradient fade -->
  <rect y="500" width="800" height="100" fill="url(#skyGrad)" opacity="0.5"/>
  
  <!-- Subtle horizon line -->
  <line x1="0" y1="520" x2="800" y2="520" stroke="#1a237e" stroke-width="0.5" opacity="0.3"/>
</svg>
