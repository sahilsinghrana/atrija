  <!-- Foreground grass blades -->
  <g opacity="0.6">
    <line x1="50" y1="600" x2="55" y2="480" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="150" y1="600" x2="145" y2="500" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <line x1="300" y1="600" x2="310" y2="490" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="450" y1="600" x2="440" y2="510" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <line x1="600" y1="600" x2="610" y2="485" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="750" y1="600" x2="740" y2="495" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <line x1="900" y1="600" x2="910" y2="505" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="1050" y1="600" x2="1040" y2="490" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    <line x1="1150" y1="600" x2="1160" y2="500" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Light particles / fireflies -->
  <g>
    <circle cx="300" cy="400" r="3" fill="#fde68a" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="420" r="2.5" fill="#fbbf24" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="390" r="3" fill="#fde68a" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="410" r="2" fill="#fbbf24" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="400" r="2.5" fill="#fde68a" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Brushstroke texture overlay -->
  <rect width="1200" height="600" fill="none" filter="url(#brushTexture)" opacity="0.05" stroke="#ffffff" stroke-width="0.5"/>
</svg>
