<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="60%" stop-color="#ff6f00"/>
      <stop offset="100%" stop-color="#f5c800"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="400" cy="200" r="40" fill="#ffd54f" opacity="0.8"/>
  <!-- Sunflower field -->
  <g transform="translate(0,250)">
    <!-- Stems -->
    <line x1="100" y1="0" x2="100" y2="150" stroke="#2d5a1e" stroke-width="3"/>
    <line x1="200" y1="0" x2="200" y2="150" stroke="#2d5a1e" stroke-width="3"/>
    <line x1="300" y1="0" x2="300" y2="150" stroke="#2d5a1e" stroke-width="3"/>
    <line x1="400" y1="0" x2="400" y2="150" stroke="#2d5a1e" stroke-width="3"/>
    <line x1="500" y1="0" x2="500" y2="150" stroke="#2d5a1e" stroke-width="3"/>
    <line x1="600" y1="0" x2="600" y2="150" stroke="#2d5a1e" stroke-width="3"/>
    <line x1="700" y1="0" x2="700" y2="150" stroke="#2d5a1e" stroke-width="3"/>
    <!-- Petals -->
    <g fill="#f5c800">
      <ellipse cx="100" cy="-10" rx="20" ry="35" transform="rotate(0,100,-10)"/>
      <ellipse cx="100" cy="-10" rx="20" ry="35" transform="rotate(45,100,-10)"/>
      <ellipse cx="100" cy="-10" rx="20" ry="35" transform="rotate(90,100,-10)"/>
      <ellipse cx="100" cy="-10" rx="20" ry="35" transform="rotate(135,100,-10)"/>
      <ellipse cx="200" cy="-10" rx="20" ry="35" transform="rotate(20,200,-10)"/>
      <ellipse cx="200" cy="-10" rx="20" ry="35" transform="rotate(65,200,-10)"/>
      <ellipse cx="200" cy="-10" rx="20" ry="35" transform="rotate(110,200,-10)"/>
      <ellipse cx="200" cy="-10" rx="20" ry="35" transform="rotate(155,200,-10)"/>
      <ellipse cx="300" cy="-10" rx="20" ry="35" transform="rotate(10,300,-10)"/>
      <ellipse cx="300" cy="-10" rx="20" ry="35" transform="rotate(55,300,-10)"/>
      <ellipse cx="300" cy="-10" rx="20" ry="35" transform="rotate(100,300,-10)"/>
      <ellipse cx="300" cy="-10" rx="20" ry="35" transform="rotate(145,300,-10)"/>
      <ellipse cx="400" cy="-10" rx="20" ry="35" transform="rotate(30,400,-10)"/>
      <ellipse cx="400" cy="-10" rx="20" ry="35" transform="rotate(75,400,-10)"/>
      <ellipse cx="400" cy="-10" rx="20" ry="35" transform="rotate(120,400,-10)"/>
      <ellipse cx="400" cy="-10" rx="20" ry="35" transform="rotate(165,400,-10)"/>
      <ellipse cx="500" cy="-10" rx="20" ry="35" transform="rotate(15,500,-10)"/>
      <ellipse cx="500" cy="-10" rx="20" ry="35" transform="rotate(60,500,-10)"/>
      <ellipse cx="500" cy="-10" rx="20" ry="35" transform="rotate(105,500,-10)"/>
      <ellipse cx="500" cy="-10" rx="20" ry="35" transform="rotate(150,500,-10)"/>
      <ellipse cx="600" cy="-10" rx="20" ry="35" transform="rotate(5,600,-10)"/>
      <ellipse cx="600" cy="-10" rx="20" ry="35" transform="rotate(50,600,-10)"/>
      <ellipse cx="600" cy="-10" rx="20" ry="35" transform="rotate(95,600,-10)"/>
      <ellipse cx="600" cy="-10" rx="20" ry="35" transform="rotate(140,600,-10)"/>
      <ellipse cx="700" cy="-10" rx="20" ry="35" transform="rotate(25,700,-10)"/>
      <ellipse cx="700" cy="-10" rx="20" ry="35" transform="rotate(70,700,-10)"/>
      <ellipse cx="700" cy="-10" rx="20" ry="35" transform="rotate(115,700,-10)"/>
      <ellipse cx="700" cy="-10" rx="20" ry="35" transform="rotate(160,700,-10)"/>
    </g>
    <!-- Centers -->
    <g fill="#4a2800">
      <circle cx="100" cy="-10" r="10"/><circle cx="200" cy="-10" r="10"/>
      <circle cx="300" cy="-10" r="10"/><circle cx="400" cy="-10" r="10"/>
      <circle cx="500" cy="-10" r="10"/><circle cx="600" cy="-10" r="10"/>
      <circle cx="700" cy="-10" r="10"/>
    </g>
  </g>
</svg>