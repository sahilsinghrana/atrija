<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1200"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Flute -->
  <g transform="translate(250,100) rotate(-15)">
    <rect x="0" y="0" width="300" height="20" rx="10" fill="#d4a843"/>
    <rect x="0" y="2" width="300" height="6" rx="3" fill="#e8c060" opacity="0.5"/>
    <!-- Finger holes -->
    <circle cx="50" cy="10" r="5" fill="#1a1a1a"/>
    <circle cx="90" cy="10" r="5" fill="#1a1a1a"/>
    <circle cx="130" cy="10" r="5" fill="#1a1a1a"/>
    <circle cx="170" cy="10" r="5" fill="#1a1a1a"/>
    <circle cx="210" cy="10" r="5" fill="#1a1a1a"/>
    <circle cx="250" cy="10" r="5" fill="#1a1a1a"/>
    <!-- Mouthpiece -->
    <rect x="-20" y="-5" width="30" height="30" rx="5" fill="#c49833"/>
  </g>
  <!-- Music notes floating -->
  <g fill="#ffd54f" opacity="0.6" font-size="48" font-family="serif">
    <text x="600" y="80">♪</text>
    <text x="650" y="150">♫</text>
    <text x="100" y="120">♩</text>
    <text x="150" y="200">♬</text>
    <text x="700" y="250">♪</text>
    <text x="50" y="300">♫</text>
  </g>
</svg>