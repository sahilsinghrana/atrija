<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Cosmic gradient background -->
    <radialGradient id="nebula-core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#1a0533" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#05020f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030108" stop-opacity="1"/>
    </radialGradient>
    <!-- Spiral arm gradients -->
    <linearGradient id="spiral1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#b44aff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff2d95" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="spiral2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7b2ff7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#100830" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Glow filter for stars -->
    <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <!-- Turbulence for impressionist brushstroke effect -->
    <filter id="impressionist" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="42" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Deep cosmic background -->
  <rect width="800" height="500" fill="#05020f"/>
  <rect width="800" height="500" fill="url(#nebula-core)"/>

  <!-- Impressionist nebula cloud layers -->
  <g filter="url(#impressionist)" opacity="0.5">
    <ellipse cx="400" cy="220" rx="280" ry="160" fill="#7b2ff7" opacity="0.12"/>
    <ellipse cx="320" cy="260" rx="200" ry="100" fill="#b44aff" opacity="0.08"/>
    <ellipse cx="480" cy="200" rx="240" ry="120" fill="#ff2d95" opacity="0.06"/>
    <ellipse cx="400" cy="280" rx="300" ry="80" fill="#00f0ff" opacity="0.04"/>
  </g>

  <!-- Spiral arm 1 — impressionist strokes -->
  <g opacity="0.5" filter="url(#impressionist)">
    <path d="M400,230 C450,200 520,210 560,180 C600,150 630,100 600,60" fill="none" stroke="url(#spiral1)" stroke-width="16" stroke-linecap="round"/>
    <path d="M400,230 C440,260 500,280 540,320 C580,360 600,420 560,460" fill="none" stroke="url(#spiral2)" stroke-width="14" stroke-linecap="round"/>
    <path d="M400,230 C360,200 300,210 260,180 C220,150 200,100 240,60" fill="none" stroke="url(#spiral2)" stroke-width="12" stroke-linecap="round"/>
    <path d="M400,230 C360,260 300,280 260,320 C220,360 200,420 240,460" fill="none" stroke="url(#spiral1)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Spiral arm 2 — offset for depth -->
  <g opacity="0.35" filter="url(#impressionist)">
    <path d="M400,230 C430,190 490,170 530,130" fill="none" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <path d="M400,230 C450,270 500,300 540,350" fill="none" stroke="#7b2ff7" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <path d="M400,230 C370,190 310,170 270,130" fill="none" stroke="#ff2d95" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <path d="M400,230 C350,270 300,300 260,350" fill="none" stroke="#b44aff" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Radial dust tendrils -->
  <g opacity="0.2" filter="url(#impressionist)">
    <path d="M400,230 C410,180 430,140 460,100" fill="none" stroke="#b44aff" stroke-width="4"/>
    <path d="M400,230 C440,200 480,180 520,160" fill="none" stroke="#7b2ff7" stroke-width="5"/>
    <path d="M400,230 C430,260 460,300 480,350" fill="none" stroke="#00f0ff" stroke-width="3"/>
    <path d="M400,230 C370,260 340,300 320,350" fill="none" stroke="#ff2d95" stroke-width="4"/>
    <path d="M400,230 C360,200 320,180 280,160" fill="none" stroke="#b44aff" stroke-width="3"/>
    <path d="M400,230 C420,280 440,340 430,400" fill="none" stroke="#7b2ff7" stroke-width="4"/>
    <path d="M400,230 C380,280 360,340 370,400" fill="none" stroke="#00f0ff" stroke-width="4"/>
  </g>

  <!-- Central glow -->
  <circle cx="400" cy="230" r="40" fill="#7b2ff7" opacity="0.15" filter="url(#soft-glow)"/>
  <circle cx="400" cy="230" r="15" fill="#e8e0ff" opacity="0.3" filter="url(#soft-glow)"/>
  <circle cx="400" cy="230" r="4" fill="#ffffff" opacity="0.7"/>

  <!-- Scattered stars — impressionist style -->
  <g filter="url(#star-glow)">
    <!-- Bright stars -->
    <circle cx="120" cy="80" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="680" cy="90" r="2.5" fill="#00f0ff" opacity="0.8"/>
    <circle cx="550" cy="70" r="1.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="200" cy="120" r="1.8" fill="#e8e0ff" opacity="0.7"/>
    <circle cx="620" cy="140" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="90" cy="350" r="2.2" fill="#00f0ff" opacity="0.7"/>
    <circle cx="700" cy="380" r="1.7" fill="#ffffff" opacity="0.9"/>
    <circle cx="150" cy="420" r="2" fill="#b44aff" opacity="0.7"/>
    <circle cx="650" cy="430" r="1.5" fill="#ffffff" opacity="0.8"/>

    <!-- Medium stars -->
    <circle cx="300" cy="50" r="1.2" fill="#e8e0ff" opacity="0.6"/>
    <circle cx="500" cy="55" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="750" cy="250" r="1.3" fill="#b44aff" opacity="0.5"/>
    <circle cx="50" cy="200" r="1.1" fill="#00f0ff" opacity="0.5"/>
    <circle cx="350" cy="470" r="1.4" fill="#ffffff" opacity="0.6"/>
    <circle cx="450" cy="480" r="1" fill="#e8e0ff" opacity="0.4"/>
    <circle cx="250" cy="30" r="1" fill="#7b2ff7" opacity="0.4"/>
    <circle cx="580" cy="470" r="1.2" fill="#ff2d95" opacity="0.4"/>

    <!-- Tiny stars -->
    <circle cx="180" cy="180" r="0.8" fill="#ffffff" opacity="0.4"/>
    <circle cx="620" cy="280" r="0.7" fill="#e8e0ff" opacity="0.3"/>
    <circle cx="100" cy="270" r="0.9" fill="#b44aff" opacity="0.3"/>
    <circle cx="720" cy="180" r="0.8" fill="#00f0ff" opacity="0.3"/>
    <circle cx="400" cy="450" r="0.7" fill="#ffffff" opacity="0.4"/>
    <circle cx="320" cy="400" r="0.6" fill="#e8e0ff" opacity="0.3"/>
    <circle cx="480" cy="420" r="0.8" fill="#7b2ff7" opacity="0.3"/>
    <circle cx="160" cy="380" r="0.7" fill="#ffffff" opacity="0.3"/>
    <circle cx="640" cy="340" r="0.9" fill="#e8e0ff" opacity="0.3"/>
    <circle cx="240" cy="140" r="0.6" fill="#ff2d95" opacity="0.3"/>
    <circle cx="560" cy="120" r="0.7" fill="#00f0ff" opacity="0.3"/>
    <circle cx="380" cy="80" r="0.8" fill="#ffffff" opacity="0.3"/>

    <!-- Star cross spikes for brightest -->
    <line x1="118" y1="80" x2="122" y2="80" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
    <line x1="120" y1="78" x2="120" y2="82" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
    <line x1="678" y1="90" x2="682" y2="90" stroke="#00f0ff" stroke-width="0.5" opacity="0.4"/>
    <line x1="680" y1="88" x2="680" y2="92" stroke="#00f0ff" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Impressionist brushstroke details on nebula -->
  <g opacity="0.15" filter="url(#impressionist)">
    <path d="M350,180 Q380,160 410,180 Q440,200 420,230" fill="none" stroke="#ff2d95" stroke-width="6" stroke-linecap="round"/>
    <path d="M370,200 Q400,180 430,200 Q460,220 440,250" fill="none" stroke="#7b2ff7" stroke-width="5" stroke-linecap="round"/>
    <path d="M330,250 Q360,230 390,250 Q420,270 400,300" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M420,200 Q450,180 480,200 Q510,220 490,250" fill="none" stroke="#b44aff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Foreground impressionist strokes — subtle framing -->
  <g opacity="0.08" filter="url(#impressionist)">
    <path d="M0,450 Q100,430 200,460 Q300,490 400,450 Q500,410 600,460 Q700,510 800,450" fill="none" stroke="#7b2ff7" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
