<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Impressionist texture filter -->
    <filter id="impasto" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="42" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd89b"/>
      <stop offset="40%" stop-color="#ffc9a8"/>
      <stop offset="70%" stop-color="#c9a0dc"/>
      <stop offset="100%" stop-color="#87ceeb"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e5a1e"/>
      <stop offset="100%" stop-color="#1a3a0e"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="680" cy="80" r="120">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffcc02" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff6f00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flowerCenter1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5d4037"/>
      <stop offset="60%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Sun glow -->
  <circle cx="680" cy="80" r="120" fill="url(#sunGlow)"/>
  <circle cx="680" cy="80" r="35" fill="#fff9c4" filter="url(#softGlow)"/>

  <!-- Distant treeline -->
  <path d="M0,280 Q50,240 100,260 Q150,230 200,250 Q280,220 350,245 Q420,215 480,240 Q540,220 600,250 Q660,225 720,245 Q760,230 800,255 L800,320 L0,320 Z" fill="#1a3a0e" opacity="0.7"/>
  <path d="M0,290 Q80,260 160,275 Q240,250 320,270 Q400,245 480,265 Q560,240 640,260 Q720,245 800,265 L800,330 L0,330 Z" fill="#2e5a1e" opacity="0.6"/>

  <!-- Garden path -->
  <path d="M350,500 Q380,420 400,380 Q420,340 410,300" stroke="#8d6e63" stroke-width="40" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M360,500 Q390,430 405,390 Q415,350 408,310" stroke="#a1887f" stroke-width="25" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Background sunflower stems -->
  <path d="M120,420 Q115,380 118,340 Q120,300 125,280" stroke="#33691e" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M200,430 Q195,390 198,350 Q200,310 205,290" stroke="#33691e" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M600,420 Q595,380 598,340 Q600,300 605,275" stroke="#33691e" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M680,430 Q675,390 678,350 Q680,310 685,285" stroke="#33691e" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- Background sunflower heads (smaller, muted) -->
  <g opacity="0.5" filter="url(#impasto)">
    <circle cx="125" cy="275" r="22" fill="#c9a030"/>
    <circle cx="125" cy="275" r="10" fill="#5d4037"/>
    <circle cx="205" cy="285" r="20" fill="#b8960f"/>
    <circle cx="205" cy="285" r="9" fill="#5d4037"/>
    <circle cx="605" cy="270" r="24" fill="#c9a030"/>
    <circle cx="605" cy="270" r="11" fill="#5d4037"/>
    <circle cx="685" cy="280" r="21" fill="#b8960f"/>
    <circle cx="685" cy="280" r="10" fill="#5d4037"/>
  </g>

  <!-- Main sunflower 1 - left foreground -->
  <g filter="url(#impasto)">
    <path d="M180,500 Q170,430 175,370 Q178,320 185,280" stroke="#2e7d32" stroke-width="6" fill="none"/>
    <!-- Leaves -->
    <path d="M175,420 Q140,400 130,410 Q145,425 175,420" fill="#388e3c"/>
    <path d="M178,370 Q210,350 220,360 Q205,375 178,370" fill="#2e7d32"/>
    <path d="M182,330 Q150,310 142,320 Q158,335 182,330" fill="#43a047"/>
    <!-- Petals -->
    <g transform="translate(185,260)">
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#f5c800" transform="rotate(0)"/>
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#fdd835" transform="rotate(30)"/>
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#f5c800" transform="rotate(60)"/>
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#ff6f00" transform="rotate(90)"/>
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#f5c800" transform="rotate(120)"/>
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#fdd835" transform="rotate(150)"/>
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#f5c800" transform="rotate(180)"/>
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#ff6f00" transform="rotate(210)"/>
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#f5c800" transform="rotate(240)"/>
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#fdd835" transform="rotate(270)"/>
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#f5c800" transform="rotate(300)"/>
      <ellipse cx="0" cy="-32" rx="8" ry="28" fill="#ff6f00" transform="rotate(330)"/>
      <!-- Outer petals -->
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(15)" opacity="0.8"/>
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(45)" opacity="0.8"/>
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(75)" opacity="0.8"/>
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(105)" opacity="0.8"/>
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(135)" opacity="0.8"/>
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(165)" opacity="0.8"/>
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(195)" opacity="0.8"/>
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(225)" opacity="0.8"/>
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(255)" opacity="0.8"/>
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(285)" opacity="0.8"/>
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(315)" opacity="0.8"/>
      <ellipse cx="0" cy="-42" rx="6" ry="22" fill="#f9a825" transform="rotate(345)" opacity="0.8"/>
      <!-- Center -->
      <circle r="18" fill="url(#flowerCenter1)"/>
      <circle r="14" fill="#4e342e"/>
      <!-- Seed pattern -->
      <circle cx="-5" cy="-5" r="2" fill="#6d4c41"/>
      <circle cx="5" cy="-5" r="2" fill="#6d4c41"/>
      <circle cx="0" cy="6" r="2" fill="#6d4c41"/>
      <circle cx="-6" cy="3" r="1.5" fill="#795548"/>
      <circle cx="6" cy="3" r="1.5" fill="#795548"/>
      <circle cx="0" cy="-8" r="1.5" fill="#795548"/>
    </g>
  </g>

  <!-- Main sunflower 2 - center right, largest -->
  <g filter="url(#impasto)">
    <path d="M450,500 Q440,420 445,350 Q448,300 455,250" stroke="#2e7d32" stroke-width="7" fill="none"/>
    <!-- Leaves -->
    <path d="M445,430 Q410,410 400,420 Q415,440 445,430" fill="#388e3c"/>
    <path d="M448,370 Q480,350 490,360 Q475,378 448,370" fill="#2e7d32"/>
    <path d="M450,320 Q418,300 410,310 Q425,328 450,320" fill="#43a047"/>
    <path d="M452,290 Q485,270 495,280 Q480,298 452,290" fill="#388e3c"/>
    <!-- Petals - large -->
    <g transform="translate(455,225)">
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#f5c800" transform="rotate(0)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#fdd835" transform="rotate(25)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#f5c800" transform="rotate(50)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#ff6f00" transform="rotate(75)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#f5c800" transform="rotate(100)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#fdd835" transform="rotate(125)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#f5c800" transform="rotate(150)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#ff6f00" transform="rotate(175)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#f5c800" transform="rotate(200)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#fdd835" transform="rotate(225)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#f5c800" transform="rotate(250)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#ff6f00" transform="rotate(275)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#f5c800" transform="rotate(300)"/>
      <ellipse cx="0" cy="-38" rx="10" ry="34" fill="#fdd835" transform="rotate(325)"/>
      <!-- Outer petals -->
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(12)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(37)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(62)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(87)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(112)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(137)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(162)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(187)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(212)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(237)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(262)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(287)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(312)" opacity="0.8"/>
      <ellipse cx="0" cy="-50" rx="7" ry="26" fill="#f9a825" transform="rotate(337)" opacity="0.8"/>
      <!-- Center -->
      <circle r="22" fill="url(#flowerCenter1)"/>
      <circle r="17" fill="#4e342e"/>
      <!-- Seed spiral pattern -->
      <circle cx="-6" cy="-6" r="2.5" fill="#6d4c41"/>
      <circle cx="6" cy="-6" r="2.5" fill="#6d4c41"/>
      <circle cx="0" cy="8" r="2.5" fill="#6d4c41"/>
      <circle cx="-8" cy="4" r="2" fill="#795548"/>
      <circle cx="8" cy="4" r="2" fill="#795548"/>
      <circle cx="0" cy="-10" r="2" fill="#795548"/>
      <circle cx="-4" cy="0" r="1.5" fill="#8d6e63"/>
      <circle cx="4" cy="0" r="1.5" fill="#8d6e63"/>
      <circle cx="-3" cy="-10" r="1.5" fill="#8d6e63"/>
      <circle cx="3" cy="-10" r="1.5" fill="#8d6e63"/>
    </g>
  </g>

  <!-- Main sunflower 3 - right foreground -->
  <g filter="url(#impasto)">
    <path d="M650,500 Q640,430 645,370 Q648,320 655,275" stroke="#2e7d32" stroke-width="6" fill="none"/>
    <!-- Leaves -->
    <path d="M645,440 Q610,420 600,430 Q615,448 645,440" fill="#388e3c"/>
    <path d="M648,380 Q680,360 690,370 Q675,388 648,380" fill="#2e7d32"/>
    <path d="M652,330 Q620,310 612,320 Q628,338 652,330" fill="#43a047"/>
    <!-- Petals -->
    <g transform="translate(655,252)">
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#f5c800" transform="rotate(0)"/>
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#fdd835" transform="rotate(30)"/>
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#f5c800" transform="rotate(60)"/>
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#ff6f00" transform="rotate(90)"/>
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#f5c800" transform="rotate(120)"/>
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#fdd835" transform="rotate(150)"/>
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#f5c800" transform="rotate(180)"/>
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#ff6f00" transform="rotate(210)"/>
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#f5c800" transform="rotate(240)"/>
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#fdd835" transform="rotate(270)"/>
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#f5c800" transform="rotate(300)"/>
      <ellipse cx="0" cy="-30" rx="8" ry="26" fill="#ff6f00" transform="rotate(330)"/>
      <!-- Outer petals -->
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(15)" opacity="0.8"/>
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(45)" opacity="0.8"/>
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(75)" opacity="0.8"/>
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(105)" opacity="0.8"/>
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(135)" opacity="0.8"/>
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(165)" opacity="0.8"/>
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(195)" opacity="0.8"/>
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(225)" opacity="0.8"/>
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(255)" opacity="0.8"/>
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(285)" opacity="0.8"/>
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(315)" opacity="0.8"/>
      <ellipse cx="0" cy="-40" rx="6" ry="20" fill="#f9a825" transform="rotate(345)" opacity="0.8"/>
      <!-- Center -->
      <circle r="17" fill="url(#flowerCenter1)"/>
      <circle r="13" fill="#4e342e"/>
      <circle cx="-4" cy="-4" r="2" fill="#6d4c41"/>
      <circle cx="4" cy="-4" r="2" fill="#6d4c41"/>
      <circle cx="0" cy="5" r="2" fill="#6d4c41"/>
      <circle cx="-5" cy="2" r="1.5" fill="#795548"/>
      <circle cx="5" cy="2" r="1.5" fill="#795548"/>
    </g>
  </g>

  <!-- Bee -->
  <g transform="translate(490,260) rotate(-15)">
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="#fdd835"/>
    <ellipse cx="-2" cy="0" rx="3" ry="5" fill="#3e2723"/>
    <ellipse cx="3" cy="0" rx="3" ry="5" fill="#3e2723"/>
    <ellipse cx="-6" cy="-2" rx="5" ry="2" fill="#e0e0e0" opacity="0.6"/>
    <ellipse cx="6" cy="-2" rx="5" ry="2" fill="#e0e0e0" opacity="0.6"/>
    <circle cx="-4" cy="-3" r="1.5" fill="#212121"/>
    <circle cx="4" cy="-3" r="1.5" fill="#212121"/>
  </g>

  <!-- Light rays from sun -->
  <g opacity="0.15">
    <polygon points="680,80 550,300 600,320" fill="#fff9c4"/>
    <polygon points="680,80 500,280 540,310" fill="#fff9c4"/>
    <polygon points="680,80 450,260 490,290" fill="#fff9c4"/>
    <polygon points="680,80 620,280 660,300" fill="#fff9c4"/>
  </g>

  <!-- Foreground grass blades -->
  <g opacity="0.7">
    <path d="M0,500 Q5,470 10,500" stroke="#2e7d32" stroke-width="2" fill="none"/>
    <path d="M30,500 Q35,465 42,500" stroke="#388e3c" stroke-width="2" fill="none"/>
    <path d="M70,500 Q78,475 85,500" stroke="#2e7d32" stroke-width="2" fill="none"/>
    <path d="M150,500 Q155,468 162,500" stroke="#388e3c" stroke-width="2" fill="none"/>
    <path d="M250,500 Q258,472 265,500" stroke="#2e7d32" stroke-width="2" fill="none"/>
    <path d="M320,500 Q325,470 332,500" stroke="#388e3c" stroke-width="2" fill="none"/>
    <path d="M500,500 Q508,475 515,500" stroke="#2e7d32" stroke-width="2" fill="none"/>
    <path d="M580,500 Q585,468 592,500" stroke="#388e3c" stroke-width="2" fill="none"/>
    <path d="M700,500 Q708,472 715,500" stroke="#2e7d32" stroke-width="2" fill="none"/>
    <path d="M750,500 Q755,470 762,500" stroke="#388e3c" stroke-width="2" fill="none"/>
    <path d="M790,500 Q795,475 800,500" stroke="#2e7d32" stroke-width="2" fill="none"/>
  </g>

  <!-- Falling petal -->
  <ellipse cx="380" cy="350" rx="5" ry="8" fill="#f5c800" opacity="0.6" transform="rotate(30,380,350)"/>
  <ellipse cx="530" cy="380" rx="4" ry="7" fill="#fdd835" opacity="0.5" transform="rotate(-20,530,380)"/>

  <!-- Impressionist brushstroke overlay for texture -->
  <rect width="800" height="500" fill="none" stroke="none" opacity="0.03"/>
</svg>
