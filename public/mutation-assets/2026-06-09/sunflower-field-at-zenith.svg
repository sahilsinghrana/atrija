  <!-- Light dabs / atmospheric texture -->
  <g opacity="0.15">
    <circle cx="150" cy="140" r="35" fill="#fde68a"/>
    <circle cx="300" cy="100" r="28" fill="#fef3c7"/>
    <circle cx="500" cy="120" r="32" fill="#fde68a"/>
    <circle cx="650" cy="150" r="25" fill="#fef3c7"/>
    <circle cx="400" cy="80" r="40" fill="#fffbeb"/>
    <circle cx="200" cy="180" r="22" fill="#fbbf24"/>
    <circle cx="550" cy="175" r="20" fill="#fbbf24"/>
