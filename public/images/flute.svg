<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fluteBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1200"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="noteGlow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="800" height="400" fill="url(#fluteBg)"/>
  <!-- Warm light from left -->
  <ellipse cx="100" cy="200" rx="200" ry="300" fill="#ffd54f" opacity="0.04"/>
  <!-- Flute body -->
  <g transform="translate(200,120) rotate(-12)">
    <rect x="0" y="0" width="400" height="18" rx="9" fill="#d4a843"/>
    <rect x="0" y="2" width="400" height="5" rx="2.5" fill="#e8c060" opacity="0.4"/>
    <!-- Gold bands -->
    <rect x="0" y="0" width="8" height="18" rx="4" fill="#c49833"/>
    <rect x="370" y="0" width="30" height="18" rx="5" fill="#c49833"/>
    <!-- Finger holes -->
    <circle cx="60" cy="9" r="4" fill="#1a1a1a"/>
    <circle cx="110" cy="9" r="4" fill="#1a1a1a"/>
    <circle cx="160" cy="9" r="4" fill="#1a1a1a"/>
    <circle cx="210" cy="9" r="4" fill="#1a1a1a"/>
    <circle cx="260" cy="9" r="4" fill="#1a1a1a"/>
    <circle cx="310" cy="9" r="4" fill="#1a1a1a"/>
  </g>
  <!-- Music notes floating -->
  <g fill="#ffd54f" opacity="0.5" filter="url(#noteGlow)">
    <text x="620" y="80" font-size="48" font-family="serif">♪</text>
    <text x="680" y="150" font-size="36" font-family="serif">♫</text>
    <text x="100" y="100" font-size="32" font-family="serif">♩</text>
    <text x="160" y="180" font-size="40" font-family="serif">♬</text>
    <text x="700" y="260" font-size="36" font-family="serif">♪</text>
    <text x="60" y="280" font-size="32" font-family="serif">♫</text>
  </g>
  <!-- Subtle notes without glow -->
  <g fill="#ffd54f" opacity="0.25">
    <text x="580" cy="120" font-size="28" font-family="serif">♩</text>
    <text x="140" y="320" font-size="24" font-family="serif">♪</text>
  </g>
</svg>