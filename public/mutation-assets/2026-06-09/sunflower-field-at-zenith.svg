      <ellipse cx="372" cy="195" rx="11" ry="24" transform="rotate(30,342,222)"/>
      <ellipse cx="382" cy="222" rx="11" ry="24" transform="rotate(60,342,222)"/>
      <ellipse cx="372" cy="250" rx="11" ry="24" transform="rotate(100,342,222)"/>
      <ellipse cx="342" cy="264" rx="11" ry="24" transform="rotate(150,342,222)"/>
      <ellipse cx="312" cy="250" rx="11" ry="24" transform="rotate(210,342,222)"/>
      <ellipse cx="302" cy="222" rx="11" ry="24" transform="rotate(260,342,222)"/>
      <ellipse cx="312" cy="195" rx="11" ry="24" transform="rotate(310,342,222)"/>
      <ellipse cx="328" cy="188" rx="10" ry="20" transform="rotate(15,342,222)"/>
